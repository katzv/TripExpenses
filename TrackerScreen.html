<!-- VIEW: TRACKER -->
<div class="view" id="view-tracker">
  <div class="tracker-tabs">
    <button class="tracker-tab on" id="tab-list" onclick="switchTrackerTab('list')">📋 List</button>
    <button class="tracker-tab"    id="tab-cal"  onclick="switchTrackerTab('cal')">📅 Calendar</button>
    <button class="tracker-tab"    id="tab-map"  onclick="switchTrackerTab('map')">🗺 Map</button>
  </div>

  <div class="ci-form" id="ci-form-wrap" style="display:none">
    <div class="ci-form-title">📍 Check-in</div>
    <div class="fg" style="margin-bottom:10px">
      <label>Place Name <span class="req">*</span></label>
      <div class="suggest-wrap">
        <input class="fc" id="ciName" type="text" placeholder="Start typing a place name…"
               autocomplete="off" oninput="onCiNameInput()" onfocus="onCiNameFocus()" onkeydown="onCiNameKeydown(event)">
        <div class="suggest-list" id="ciSuggest" style="display:none"></div>
      </div>
      <div class="gps-status" id="gpsStatus">
        <div class="gps-dot spin-dot" id="gpsDot"></div>
        <span id="gpsText" style="flex:1">Acquiring GPS…</span>
        <button onclick="openMapPicker()" style="background:none;border:1.5px solid var(--primary);color:var(--primary);border-radius:7px;padding:3px 9px;font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap;flex-shrink:0">&#128205; Pick on Map</button>
      </div>
    </div>
    <div class="frow" style="margin-bottom:10px">
      <div class="fg" style="margin-bottom:0">
        <label>Date</label>
        <input class="fc" id="ciDate" type="date">
      </div>
      <div class="fg" style="margin-bottom:0">
        <label>Time</label>
        <input class="fc" id="ciTime" type="time">
      </div>
    </div>
    <div class="fg" style="margin-bottom:12px">
      <label>Type</label>
      <div style="position:relative">
        <input class="fc" id="ciTypeInput" type="text" placeholder="Type…" autocomplete="off"
               oninput="_filterTrackerTypeList(this.value)" onfocus="_openTrackerTypeList()" onkeydown="_trackerTypeKeydown(event)">
        <div class="suggest-list" id="ciTypeList" style="display:none"></div>
        <input type="hidden" id="ciType" value="place">
      </div>
    </div>
    <div class="btn-row">
      <button class="btn btn-outline btn-sm" onclick="cancelCheckin()">Cancel</button>
      <button class="btn btn-accent btn-sm" id="ciSaveBtn" onclick="saveCheckinUI()">📍 Check In</button>
    </div>
  </div>

  <div id="panel-list">
    <div id="ciList"></div>
    <div style="height:80px"></div>
  </div>

  <div id="panel-cal" style="display:none">
    <div id="calContent" style="background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:10px 8px;margin-bottom:14px"></div>
    <div style="height:30px"></div>
  </div>

  <div id="panel-map" style="display:none">
    <div style="display:flex;justify-content:space-between;gap:8px;margin-bottom:8px">
      <div id="trackerAdvancedWrap" style="position:relative;margin-left:auto">
        <button type="button" class="btn btn-outline btn-sm" aria-haspopup="true" aria-expanded="false" onclick="toggleTrackerAdvancedMenu(event)" style="padding:5px 10px;min-height:32px;font-size:11px;white-space:nowrap">Advanced &#9662;</button>
        <div id="trackerAdvancedMenu" style="display:none;position:absolute;right:0;top:calc(100% + 4px);z-index:100;min-width:180px;padding:4px;background:var(--card);border:1px solid var(--border);border-radius:10px;box-shadow:0 4px 16px rgba(0,0,0,.16)">
          <button type="button" onclick="closeTrackerAdvancedMenu();repairTrackerPlaceIds()" style="display:block;width:100%;padding:9px 10px;text-align:left;background:none;border:0;border-radius:7px;color:var(--text);font-size:12px;cursor:pointer">&#128269; Repair map links</button>
          <button type="button" onclick="closeTrackerAdvancedMenu();exportTrackerKml()" style="display:block;width:100%;padding:9px 10px;text-align:left;background:none;border:0;border-radius:7px;color:var(--text);font-size:12px;cursor:pointer">&#128229; Export KML</button>
        </div>
      </div>
    </div>
    <div style="border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);margin-bottom:14px">
      <div id="tracker-map"></div>
    </div>
    <div style="height:30px"></div>
  </div>
</div>

<script>
// =======================================================
// TRACKER
// =======================================================

function trackerTypeMeta(type) {
  return LOCATION_TYPES[type] || { icon: '📌', color: '#9E9E9E', label: type || 'Place' };
}

var _trackerTypeKbIdx = -1;

function _selectTrackerType(key) {
  const type = LOCATION_TYPES[key];
  document.getElementById('ciType').value = key || '';
  document.getElementById('ciTypeInput').value = type ? (type.icon + ' ' + type.label) : '';
  const list = document.getElementById('ciTypeList');
  if (list) list.style.display = 'none';
  _trackerTypeKbIdx = -1;
}

function _renderTrackerTypeList(keys) {
  const list = document.getElementById('ciTypeList');
  if (!list) return;
  list.innerHTML = keys.map(key => {
    const type = LOCATION_TYPES[key];
    return '<div class="suggest-item" data-key="' + key + '" onclick="_selectTrackerType(\'' + key + '\')" style="font-size:12px;padding:7px 11px">' +
      '<span style="margin-right:5px">' + type.icon + '</span>' +
      '<span class="si-name">' + esc(type.label) + '</span></div>';
  }).join('');
  list.style.display = keys.length ? 'block' : 'none';
}

function _openTrackerTypeList() {
  _trackerTypeKbIdx = -1;
  const keys = Object.keys(LOCATION_TYPES).sort((a, b) => LOCATION_TYPES[a].label.localeCompare(LOCATION_TYPES[b].label));
  _renderTrackerTypeList(keys);
}

function _filterTrackerTypeList(value) {
  _trackerTypeKbIdx = -1;
  const raw = (value || '').trim();
  const query = raw.replace(/^[^\w]+\s*/, '').toLowerCase();
  const keys = Object.keys(LOCATION_TYPES).filter(key => {
    if (!raw) return true;
    const type = LOCATION_TYPES[key];
    return type.label.toLowerCase().includes(query) || (type.search && type.search.toLowerCase().includes(query));
  }).sort((a, b) => LOCATION_TYPES[a].label.localeCompare(LOCATION_TYPES[b].label));
  _renderTrackerTypeList(keys);
}

function _trackerTypeKeydown(event) {
  const list = document.getElementById('ciTypeList');
  const open = list && list.style.display !== 'none';
  if (event.key === 'Escape') {
    event.stopPropagation();
    if (list) list.style.display = 'none';
    _trackerTypeKbIdx = -1;
    return;
  }
  if (event.key === 'ArrowDown' && !open) {
    event.preventDefault();
    _openTrackerTypeList();
    return;
  }
  if (!open) return;
  const items = list.querySelectorAll('.suggest-item');
  if (!items.length) return;
  if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
    event.preventDefault();
    items.forEach(item => item.classList.remove('active'));
    _trackerTypeKbIdx = event.key === 'ArrowDown'
      ? Math.min(_trackerTypeKbIdx + 1, items.length - 1)
      : Math.max(_trackerTypeKbIdx - 1, 0);
    items[_trackerTypeKbIdx].classList.add('active');
    items[_trackerTypeKbIdx].scrollIntoView({ block: 'nearest' });
  } else if (event.key === 'Enter' && _trackerTypeKbIdx >= 0) {
    event.preventDefault();
    const key = items[_trackerTypeKbIdx].getAttribute('data-key');
    if (key) _selectTrackerType(key);
  }
}

function showCheckinForm() {
  S.editingCheckinId = null;
  S.gpsCoords = null;
  S.gpsSource = 'none';
  S.selectedGooglePlaceId = null;
  S.selectedGooglePlaceName = '';
  S.selectedGooglePlaceDisplayName = '';
  const _now = new Date();
  document.getElementById('ciName').value = '';
  document.getElementById('ciDate').value = today();
  document.getElementById('ciTime').value = String(_now.getHours()).padStart(2,'0') + ':' + String(_now.getMinutes()).padStart(2,'0');
  _selectTrackerType('place');
  document.getElementById('ciSaveBtn').textContent = '📍 Check In';
  hideSuggestions();
  document.getElementById('ci-form-wrap').style.display = 'block';
  acquireGPS();
  setTimeout(() => document.getElementById('ciName').focus(), 100);
}

function cancelCheckin() {
  S.editingCheckinId = null;
  document.getElementById('ci-form-wrap').style.display = 'none';
  const typeList = document.getElementById('ciTypeList');
  if (typeList) typeList.style.display = 'none';
  hideSuggestions();
}

function acquireGPS() {
  setGpsStatus('spin', 'Acquiring GPS…');
  if (!navigator.geolocation) { setGpsStatus('err', 'GPS not available'); return; }
  navigator.geolocation.getCurrentPosition(
    pos => {
      S.gpsCoords = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      S.gpsSource = 'gps';
      setGpsStatus('ok', 'GPS: ' + S.gpsCoords.lat.toFixed(5) + ', ' + S.gpsCoords.lng.toFixed(5));
      if (!document.getElementById('ciName').value.trim()) fetchNearbySuggestions();
    },
    () => {
      S.gpsCoords = null;
      S.gpsSource = 'none';
      setGpsStatus('err', 'GPS unavailable — type a place name');
    },
    { enableHighAccuracy: true, timeout: 10000 }
  );
}

function setGpsStatus(state, text) {
  const dot = document.getElementById('gpsDot');
  const txt = document.getElementById('gpsText');
  if (!dot || !txt) return;
  dot.className = 'gps-dot' + (state === 'ok' ? ' ok' : state === 'spin' ? ' spin-dot' : state === 'err' ? ' err' : '');
  txt.textContent = text;
}

function onCiNameFocus() {
  const q = (document.getElementById('ciName').value || '').trim();
  if (!q && S.gpsCoords) fetchNearbySuggestions();
}

function onCiNameInput() {
  const q = (document.getElementById('ciName').value || '').trim();
  if (q !== (S.selectedGooglePlaceName || '')) {
    S.selectedGooglePlaceId = null;
    S.selectedGooglePlaceDisplayName = '';
  }
  clearTimeout(S.suggestTimer);
  if (!q) {
    if (S.gpsCoords) fetchNearbySuggestions();
    else hideSuggestions();
    return;
  }
  S.suggestTimer = setTimeout(() => searchByName(q), 600);
}

var _ciSuggestIdx = -1;

function onCiNameKeydown(e) {
  const list = document.getElementById('ciSuggest');
  const open = list && list.style.display !== 'none';
  if (!open) return;
  if (e.key === 'ArrowDown') { e.preventDefault(); _ciSuggestIdx = _navigateSuggest('ciSuggest', _ciSuggestIdx, 1); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); _ciSuggestIdx = _navigateSuggest('ciSuggest', _ciSuggestIdx, -1); }
  else if (e.key === 'Enter' && _ciSuggestIdx >= 0) {
    e.preventDefault();
    const el = list.querySelectorAll('.suggest-item')[_ciSuggestIdx];
    if (el) selectSuggestion(el);
    _ciSuggestIdx = -1;
  } else if (e.key === 'Escape') { e.stopPropagation(); hideSuggestions(); _ciSuggestIdx = -1; }
}

function fetchNearbySuggestions() {
  if (!S.gpsCoords) return;
  const { lat, lng } = S.gpsCoords;
  loadGoogleMaps(() => {
    const svc = _getPlacesService();
    if (!svc) return;
    const skipTypes = new Set(['locality','political','country','colloquial_area',
      'administrative_area_level_1','administrative_area_level_2',
      'administrative_area_level_3','administrative_area_level_4',
      'natural_feature','route','street_address','postal_code']);
    svc.nearbySearch({ location: { lat, lng }, radius: 300 }, (results, status) => {
      if (status !== google.maps.places.PlacesServiceStatus.OK || !results) return;
      const items = results
        .filter(r => r.types && !r.types.some(t => skipTypes.has(t)))
        .slice(0, 8)
        .map(r => {
          const typeKey = _googleTypeToPlanner(r.types || []);
          return {
            place_id: r.place_id,
            name: r.name,
            sub: (LOCATION_TYPES[typeKey] || {}).label || '',
            type: typeKey,
            lat: r.geometry.location.lat(), lng: r.geometry.location.lng()
          };
        });
      if (items.length) showSuggestions(items);
    });
  });
}

function searchByName(q) {
  loadGoogleMaps(() => {
    const svc = new google.maps.places.AutocompleteService();
    svc.getPlacePredictions({ input: q, sessionToken: _trackerToken(), language: 'en' }, (predictions, status) => {
      if (status !== google.maps.places.PlacesServiceStatus.OK || !predictions) { hideSuggestions(); return; }
      const items = predictions.slice(0, 8).map(p => ({
        place_id: p.place_id,
        name: p.structured_formatting.main_text,
        sub: p.structured_formatting.secondary_text || '',
        lat: null, lng: null
      }));
      showSuggestions(items);
    });
  });
}

function showSuggestions(items) {
  _ciSuggestIdx = -1;
  const list = document.getElementById('ciSuggest');
  if (!list) return;
  list.innerHTML = items.map(item => `
    <div class="suggest-item"
         data-name="${esc(item.name)}"
         data-lat="${item.lat || ''}"
         data-lng="${item.lng || ''}"
         data-place-id="${item.place_id || ''}"
         data-type="${esc(item.type || '')}"
         onclick="selectSuggestion(this)">
      <div class="si-name">${esc(item.name)}</div>
      ${item.sub ? `<div class="si-sub">${esc(item.sub)}</div>` : ''}
    </div>`).join('');
  list.style.display = 'block';
}

function hideSuggestions() {
  _ciSuggestIdx = -1;
  const list = document.getElementById('ciSuggest');
  if (list) list.style.display = 'none';
}

function selectSuggestion(el) {
  const name    = el.getAttribute('data-name');
  const lat     = parseFloat(el.getAttribute('data-lat')) || null;
  const lng     = parseFloat(el.getAttribute('data-lng')) || null;
  const placeId = el.getAttribute('data-place-id');
  S.selectedGooglePlaceId = placeId || null;
  S.selectedGooglePlaceName = name;
  S.selectedGooglePlaceDisplayName = name;
  const type    = el.getAttribute('data-type') || '';
  document.getElementById('ciName').value = name;
  hideSuggestions();
  // Auto-classify type if known
  if (type && type !== 'place' && LOCATION_TYPES[type]) _selectTrackerType(type);
  if (lat && lng) {
    S.gpsCoords = { lat, lng };
    S.gpsSource = 'google';
    setGpsStatus('ok', 'Location: ' + lat.toFixed(5) + ', ' + lng.toFixed(5));
  } else if (placeId && window.google) {
    setGpsStatus('spin', 'Getting location...');
    _getPlacesService().getDetails({ placeId, fields: ['geometry', 'types'], sessionToken: _trackerToken() }, (place, status) => {
      _trackerAcToken = null;
      if (status === 'OK' && place && place.geometry) {
        const loc = place.geometry.location;
        S.gpsCoords = { lat: loc.lat(), lng: loc.lng() };
        S.gpsSource = 'google';
        setGpsStatus('ok', 'Location: ' + S.gpsCoords.lat.toFixed(5) + ', ' + S.gpsCoords.lng.toFixed(5));
        // Auto-classify from returned types if not already set from data-type
        if (!type || type === 'place') {
          const typeKey = _googleTypeToPlanner(place.types || []);
          if (typeKey && typeKey !== 'place') {
            if (LOCATION_TYPES[typeKey]) _selectTrackerType(typeKey);
          }
        }
      } else { setGpsStatus('err', 'Could not get location — pick on map'); }
    });
  }
}

function saveCheckinUI() {
  const name = (document.getElementById('ciName').value || '').trim();
  if (!name) { toast('Enter a place name', 'err'); return; }
  const type = document.getElementById('ciType').value;
  const btn  = document.getElementById('ciSaveBtn');
  btn.disabled = true; btn.textContent = 'Saving…';

  const dateVal = document.getElementById('ciDate').value;
  const timeVal = document.getElementById('ciTime').value;
  const timestamp = (dateVal && timeVal)
    ? new Date(dateVal + 'T' + timeVal + ':00').toISOString()
    : new Date().toISOString();

  const data = {
    tripId:    S.currentTrip.id,
    timestamp,
    name, type,
    lat:       S.gpsCoords ? S.gpsCoords.lat : null,
    lng:       S.gpsCoords ? S.gpsCoords.lng : null,
    googlePlaceId: S.selectedGooglePlaceId || null,
    googlePlaceName: S.selectedGooglePlaceDisplayName || null,
    gpsSource: S.gpsSource || 'none'
  };

  const onErr = err => {
    btn.disabled = false; btn.textContent = S.editingCheckinId ? '✓ Update' : '📍 Check In';
    toast('Error: ' + err.message, 'err');
  };

  if (S.editingCheckinId) {
    data.id = S.editingCheckinId;
    google.script.run
      .withSuccessHandler(res => {
        if (!res || !res.success) { onErr({ message: (res && res.error) || 'Update failed' }); return; }
        btn.disabled = false; btn.textContent = '✓ Update';
        cancelCheckin();
        refreshCheckinOrder();
        toast('Check-in updated!', 'ok');
      })
      .withFailureHandler(onErr)
      .updateCheckin(data);
  } else {
    google.script.run
      .withSuccessHandler(res => {
        btn.disabled = false; btn.textContent = '📍 Check In';
        if (res && res.success) {
          cancelCheckin();
          refreshCheckinOrder();
          toast('Checked in!', 'ok');
        } else toast('Save failed', 'err');
      })
      .withFailureHandler(onErr)
      .saveCheckin(data);
  }
}

// Re-read the persisted sequence after a mutation so the current view reflects
// the database's chronological order immediately, without requiring a refresh.
function refreshCheckinOrder() {
  google.script.run
    .withSuccessHandler(cis => {
      S.checkins = cis || [];
      if (S.trackerTab === 'list') renderCheckinList();
      if (S.trackerTab === 'cal')  buildCalendar();
      if (S.trackerTab === 'map')  setTimeout(initTrackerMap, 50);
    })
    .withFailureHandler(err => toast('Could not refresh check-ins: ' + err.message, 'err'))
    .loadCheckins(S.currentTrip.id);
}

function loadCheckins() {
  const el = document.getElementById('ciList');
  if (el) el.innerHTML = '<div style="text-align:center;padding:32px;color:var(--muted)">Loading…</div>';
  let _cis = null, _descs = null;
  function _onBoth() {
    if (_cis === null || _descs === null) return;
    S.checkins = _cis;
    S.calDescs = _descs;
    if (S.trackerTab === 'list') renderCheckinList();
    if (S.trackerTab === 'cal')  buildCalendar();
    if (S.trackerTab === 'map')  setTimeout(initTrackerMap, 50);
  }
  google.script.run
    .withSuccessHandler(cis => { _cis = cis || []; _onBoth(); })
    .withFailureHandler(() => {
      if (el) el.innerHTML = '<div style="color:var(--danger);padding:20px">Failed to load check-ins</div>';
    })
    .loadCheckins(S.currentTrip.id);
  google.script.run
    .withSuccessHandler(descs => { _descs = descs || {}; _onBoth(); })
    .withFailureHandler(() => { _descs = {}; _onBoth(); })
    .getCalDescs(S.currentTrip.id);
}

function compareCheckinsByTime(a, b) {
  const aTime = Date.parse(a.timestamp || '');
  const bTime = Date.parse(b.timestamp || '');
  if (Number.isFinite(aTime) && Number.isFinite(bTime) && aTime !== bTime) return aTime - bTime;
  if (Number.isFinite(aTime) !== Number.isFinite(bTime)) return Number.isFinite(aTime) ? -1 : 1;
  return String(a.id || '').localeCompare(String(b.id || ''));
}

function renderCheckinList() {
  const el = document.getElementById('ciList');
  if (!el) return;
  if (!S.checkins.length) {
    el.innerHTML = `
      <div class="empty">
        <div class="empty-icon">📍</div>
        <div class="empty-title">No check-ins yet</div>
        <div class="empty-sub">Tap "+ Check-in" to record your first location</div>
      </div>`;
    return;
  }
  const groups = {};
  [...S.checkins].forEach(c => {
    const d = localDateStr(c.timestamp);
    if (!groups[d]) groups[d] = [];
    groups[d].push(c);
  });
  Object.keys(groups).forEach(d => groups[d].sort(compareCheckinsByTime));
  el.innerHTML = Object.keys(groups).sort().map(d => {
    const _di = new Date(d + 'T12:00:00Z').getDay();
    const _dowLabel = CAL_DOW_EN[_di] + ' (יום ' + CAL_DOW_HE[_di] + ')';
    return `
      <div class="dg-label">${fmtDate(d)} · ${_dowLabel}</div>
      ${groups[d].map(c => checkinCard(c)).join('')}
    `;
  }).join('');
}

function checkinCard(c) {
  const meta = trackerTypeMeta(c.type);
  const col  = meta.color || '#9E9E9E';
  const icon = meta.icon || '📌';
  const gpsInfo = (c.lat && c.lng) ? '📡 ' + parseFloat(c.lat).toFixed(4) + ', ' + parseFloat(c.lng).toFixed(4) : '';
  return `
    <div class="ci-card" onclick="editCheckinUI('${c.id}')">
      <div class="ci-icon" style="background:${col}22;color:${col}">${icon}</div>
      <div class="ci-body">
        <div class="ci-name">${esc(trackerLocationLabel(c))}</div>
        <div class="ci-time">${fmtCheckinTime(c.timestamp)}</div>
        ${gpsInfo ? `<div class="ci-gps">${gpsInfo}</div>` : ''}
      </div>
      <button class="trip-del-btn" type="button" title="Edit check-in" aria-label="Edit ${esc(c.name)}"
              onclick="event.stopPropagation();editCheckinUI('${c.id}')">&#9998;</button>
      <button class="trip-del-btn" type="button" title="Delete check-in" aria-label="Delete ${esc(c.name)}"
              onclick="event.stopPropagation();confirmDeleteCheckin('${c.id}')">&#128465;</button>
    </div>`;
}

function editCheckinUI(id) {
  const c = S.checkins.find(x => x.id === id);
  if (!c) return;
  S.editingCheckinId = id;
  S.gpsCoords = (c.lat && c.lng) ? { lat: parseFloat(c.lat), lng: parseFloat(c.lng) } : null;
  S.gpsSource = c.gpsSource || 'none';
  S.selectedGooglePlaceId = c.googlePlaceId || null;
  S.selectedGooglePlaceName = c.googlePlaceId ? (c.name || '') : '';
  S.selectedGooglePlaceDisplayName = c.googlePlaceId ? (c.googlePlaceName || c.name || '') : '';
  const _d = new Date(c.timestamp);
  document.getElementById('ciName').value = c.name || '';
  document.getElementById('ciDate').value = localDateStr(c.timestamp);
  document.getElementById('ciTime').value = String(_d.getHours()).padStart(2,'0') + ':' + String(_d.getMinutes()).padStart(2,'0');
  _selectTrackerType(c.type || 'place');
  document.getElementById('ciSaveBtn').textContent = '✓ Update';
  hideSuggestions();
  if (S.gpsCoords) {
    setGpsStatus('ok', 'Location: ' + S.gpsCoords.lat.toFixed(5) + ', ' + S.gpsCoords.lng.toFixed(5));
  } else {
    setGpsStatus('err', 'No GPS — type to search');
  }
  document.getElementById('ci-form-wrap').style.display = 'block';
  setTimeout(() => {
    document.getElementById('ci-form-wrap').scrollIntoView({ behavior: 'smooth', block: 'start' });
    document.getElementById('ciName').focus();
  }, 100);
}

function confirmDeleteCheckin(id) {
  const c = S.checkins.find(x => x.id === id);
  showModal('Delete Check-in', `
    <p style="color:var(--muted);margin-bottom:16px">
      Delete "<strong>${esc(c ? c.name : '')}</strong>"? This cannot be undone.
    </p>
    <div class="btn-row">
      <button class="btn btn-outline" onclick="closeModal()">Cancel</button>
      <button class="btn btn-danger" onclick="doDeleteCheckin('${id}')">Delete</button>
    </div>`);
}

function doDeleteCheckin(id) {
  closeModal();
  S.checkins = S.checkins.filter(c => c.id !== id);
  renderCheckinList();
  if (S.trackerTab === 'cal') buildCalendar();
  if (S.trackerTab === 'map') setTimeout(initTrackerMap, 50);
  toast('Check-in deleted', 'ok');
  google.script.run
    .withFailureHandler(err => toast('Error deleting check-in: ' + err.message, 'err'))
    .deleteCheckin(id, S.currentTrip.id);
}

function switchTrackerTab(tab) {
  const formWrap = document.getElementById('ci-form-wrap');
  if (S.trackerTab === 'list') {
    S._listFormVisible = formWrap.style.display !== 'none';
  }
  S.trackerTab = tab;
  ['list','cal','map'].forEach(t => {
    document.getElementById('tab-' + t).classList.toggle('on', t === tab);
    document.getElementById('panel-' + t).style.display = t === tab ? 'block' : 'none';
  });
  formWrap.style.display = (tab === 'list' && S._listFormVisible) ? 'block' : 'none';
  if (tab === 'list') renderCheckinList();
  if (tab === 'cal') buildCalendar();
  if (tab === 'map') setTimeout(initTrackerMap, 50);
}

const CAL_DOW_EN = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const CAL_DOW_HE = ['א׳','ב׳','ג׳','ד׳','ה׳','ו׳','ש׳'];

function toggleCalLang() {
  S.calLang = S.calLang === 'he' ? 'en' : 'he';
  buildCalendar();
}

function buildCalendar() {
  const el = document.getElementById('calContent');
  if (!el) return;
  if (!S.checkins.length) {
    el.innerHTML = '<div style="color:var(--muted);text-align:center;padding:32px">No check-ins yet</div>';
    return;
  }

  const groups = {};
  [...S.checkins].forEach(c => {
    const d = localDateStr(c.timestamp);
    if (!groups[d]) groups[d] = [];
    groups[d].push(c);
  });
  Object.keys(groups).forEach(d => groups[d].sort(compareCheckinsByTime));

  const allDates = Object.keys(groups).sort();
  const dataFirst = allDates[0];
  const dataLast  = allDates[allDates.length - 1];

  let fFrom = S.calFilterFrom || dataFirst;
  let fTo   = S.calFilterTo   || dataLast;
  if (fFrom > fTo) { const tmp = fFrom; fFrom = fTo; fTo = tmp; }

  const fd = new Date(fFrom + 'T12:00:00Z');
  const gStart = new Date(fd); gStart.setUTCDate(fd.getUTCDate() - fd.getUTCDay());

  const ld = new Date(fTo + 'T12:00:00Z');
  const gEnd = new Date(ld); gEnd.setUTCDate(ld.getUTCDate() + (6 - ld.getUTCDay()));

  const DOW_SHORT = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

  const weeks = [];
  const cur = new Date(gStart);
  while (cur <= gEnd) {
    const week = [];
    for (let i = 0; i < 7; i++) {
      const ds    = cur.toISOString().split('T')[0];
      const cis   = groups[ds] || [];
      const hotel = [...cis].reverse().find(c => c.type === 'hotel') || null;
      const dd    = String(cur.getUTCDate()).padStart(2, '0');
      const mm    = String(cur.getUTCMonth() + 1).padStart(2, '0');
      const dow   = DOW_SHORT[cur.getUTCDay()];
      week.push({ ds, dd, mm, dow, inRange: ds >= fFrom && ds <= fTo, cis, hotel });
      cur.setUTCDate(cur.getUTCDate() + 1);
    }
    weeks.push(week);
  }
  S.calWeeks = weeks;

  const dowRow = '<div class="cal7-dow-sticky"><table class="cal7-dow-table"><thead><tr>' +
    DOW_SHORT.map(d => '<th class="cal7-th">' + d + '</th>').join('') +
    '</tr></thead></table></div>';

  const bodyRows = weeks.map(week => {
    const tds = week.map(day => {
      const cls   = 'cal7-cell' + (day.inRange ? '' : ' vacant');
      const pills = day.cis.map(c => {
        const typeMeta = trackerTypeMeta(c.type);
        const col = typeMeta.color || '#9E9E9E';
        const mapsUrl = 'https://www.google.com/maps/search/?api=1&amp;query=' + encodeURIComponent(c.name || '') +
          (c.googlePlaceId ? '&amp;query_place_id=' + encodeURIComponent(c.googlePlaceId) : '');
        return '<span class="cal7-pill" style="background:' + col + '18;color:' + col + '">' + (typeMeta.icon || '') + ' <a href="' + mapsUrl + '" target="_blank" rel="noopener" style="color:inherit;text-decoration:none">' + esc(trackerLocationLabel(c)) + '</a></span>';
      }).join('');
      const hotelUrl = day.hotel ? 'https://www.google.com/maps/search/?api=1&amp;query=' + encodeURIComponent(day.hotel.name || '') : '';
      const foot = (day.hotel && day.inRange) ? '<div class="cal7-foot">🏨 <a href="' + hotelUrl + '" target="_blank" rel="noopener" style="color:inherit;text-decoration:none">' + esc(day.hotel.name) + '</a></div>' : '';
      const descText = (S.calDescs && S.calDescs[day.ds]) || '';
      const hdrCls = day.inRange ? ' cal7-hdr-edit' : '';
      const hdrClick = day.inRange ? ' onclick="editCalDesc(\'' + day.ds + '\')"' : '';
      const descSpan = (descText && day.inRange) ? ' <span class="cal7-hdr-desc">' + esc(descText) + '</span>' : '';
      return '<td class="' + cls + '"><div class="cal7-inner">' +
             '<div class="cal7-hdr' + hdrCls + '"' + hdrClick + '>' + day.dd + '/' + day.mm + descSpan + '</div>' +
             '<div class="cal7-body">' + pills + '</div>' +
             foot + '</div></td>';
    }).join('');
    return '<tr>' + tds + '</tr>';
  }).join('');

  const fv = S.calFilterFrom || '';
  const tv = S.calFilterTo   || '';
  const hasFilter = fv || tv;
  let filterBar = '<div style="display:flex;gap:6px;align-items:center;margin-bottom:10px;flex-wrap:wrap">' +
    '<span style="font-size:11px;font-weight:700;color:var(--muted);white-space:nowrap">From</span>' +
    '<input type="date" class="fc" style="width:132px;padding:5px 8px;font-size:12px;min-height:32px" value="' + fv + '" onchange="S.calFilterFrom=this.value||null;buildCalendar()">' +
    '<span style="font-size:11px;font-weight:700;color:var(--muted);white-space:nowrap">To</span>' +
    '<input type="date" class="fc" style="width:132px;padding:5px 8px;font-size:12px;min-height:32px" value="' + tv + '" onchange="S.calFilterTo=this.value||null;buildCalendar()">';
  if (hasFilter) {
    filterBar += '<button class="btn btn-outline btn-sm" style="padding:5px 10px;min-height:32px;font-size:11px;white-space:nowrap" onclick="S.calFilterFrom=null;S.calFilterTo=null;buildCalendar()">&#10005; Clear</button>';
  }
  filterBar += '<button class="btn btn-outline btn-sm" style="padding:5px 10px;min-height:32px;font-size:11px;white-space:nowrap;margin-left:auto" onclick="exportCalendar()">&#128229; Export</button>';
  filterBar += '</div>';

  el.innerHTML = filterBar + dowRow +
    '<div class="cal7-wrap"><table class="cal7-table"><tbody>' + bodyRows + '</tbody></table></div>';

  const calWrap = el.querySelector('.cal7-wrap');
  const dowTable = el.querySelector('.cal7-dow-table');
  if (calWrap && dowTable) {
    calWrap.addEventListener('scroll', function() {
      dowTable.style.transform = 'translateX(-' + calWrap.scrollLeft + 'px)';
    });
  }
}

function editCalDesc(dateStr) {
  const current = S.calDescs[dateStr] || '';
  const label = new Date(dateStr + 'T12:00:00Z').toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
  showModal('Note — ' + label,
    '<div class="fg"><textarea class="fc" id="calDescText" rows="4" placeholder="Add a note for this day…" style="resize:vertical;font-size:14px">' + esc(current) + '</textarea></div>' +
    '<div class="btn-row">' +
    (current ? '<button class="btn btn-danger btn-sm" style="flex:0;white-space:nowrap" onclick="_doSaveCalDesc(\'' + dateStr + '\',\'\')">Clear</button>' : '') +
    '<button class="btn btn-outline" onclick="closeModal()">Cancel</button>' +
    '<button class="btn btn-primary" onclick="_doSaveCalDesc(\'' + dateStr + '\',document.getElementById(\'calDescText\').value)">Save</button>' +
    '</div>');
  setTimeout(() => { const t = document.getElementById('calDescText'); if (t) { t.focus(); t.setSelectionRange(t.value.length, t.value.length); } }, 150);
}

function _doSaveCalDesc(dateStr, text) {
  const trimmed = (text || '').trim();
  closeModal();
  if (trimmed) S.calDescs[dateStr] = trimmed;
  else delete S.calDescs[dateStr];
  buildCalendar();
  google.script.run
    .withSuccessHandler(() => toast(trimmed ? 'Note saved' : 'Note cleared', 'ok'))
    .withFailureHandler(err => toast('Error: ' + err.message, 'err'))
    .saveCalDesc(S.currentTrip.id, dateStr, trimmed);
}

function exportCalendar() {
  if (!S.calWeeks || !S.calWeeks.length) { toast('Build the calendar first', 'err'); return; }
  toast('Creating Google Sheet…', '');
  const params = {
    tripTitle: S.currentTrip.title,
    weeks: S.calWeeks.map(week => week.map(day => ({
      dd:       day.dd,
      mm:       day.mm,
      inRange:  day.inRange,
      desc:     (S.calDescs && S.calDescs[day.ds]) || '',
      cis:      day.cis.map(c => {
        const meta = trackerTypeMeta(c.type);
        return { name: trackerLocationLabel(c), googlePlaceId: c.googlePlaceId || '', type: c.type, icon: meta.icon, color: meta.color, label: meta.label };
      }),
      hasHotel: !!day.hotel
    })))
  };
  google.script.run
    .withSuccessHandler(res => {
      if (res && res.success) {
        window.open(res.url, '_blank');
        toast('Sheet created!', 'ok');
      } else {
        toast('Export failed: ' + (res && res.error || 'unknown'), 'err');
      }
    })
    .withFailureHandler(err => toast('Export error: ' + err.message, 'err'))
    .exportCalendarToSheet(params);
}

function exportTrackerKml() {
  const withGPS = S.checkins.filter(c => c.lat && c.lng);
  if (!withGPS.length) { toast('No GPS check-ins to export', 'err'); return; }

  const _S = 'https://maps.google.com/mapfiles/kml/shapes/';
  const KML_ICONS = {
    'place':      'https://maps.google.com/mapfiles/kml/paddle/blu-blank.png',
    'hotel':      _S + 'lodging.png',
    'restaurant': _S + 'dining.png',
    'attraction': _S + 'arts.png',
    'transport':  _S + 'cabs.png',
    'flight-in':  _S + 'airports.png',
    'flight-out': _S + 'airports.png',
    'nature-hike': _S + 'hiker.png',
    'supermarket': _S + 'grocery.png',
    'other':      _S + 'info_circle.png'
  };

  function toKmlColor(hex) {
    const r = hex.slice(1,3), g = hex.slice(3,5), b = hex.slice(5,7);
    return 'ff' + b + g + r;
  }

  const types = [...new Set(withGPS.map(c => c.type))];

  function kx(s) {
    return String(s || '')
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  const KML_BLUE   = toKmlColor('#1A73E8');
  const KML_PURPLE = toKmlColor('#7B1FA2');
  const KML_TYPE_COLORS = { 'hotel': KML_PURPLE };

  const styles = types.map(type => {
    const col  = KML_TYPE_COLORS[type] || KML_BLUE;
    const icon = KML_ICONS[type] || KML_ICONS['other'];
    const id   = 'ci-' + type;
    return '    <Style id="' + id + '-normal">' +
      '<IconStyle><color>' + col + '</color><scale>1</scale><Icon><href>' + icon + '</href></Icon></IconStyle>' +
      '<LabelStyle><scale>0</scale></LabelStyle></Style>' +
      '    <Style id="' + id + '-highlight">' +
      '<IconStyle><color>' + col + '</color><scale>1</scale><Icon><href>' + icon + '</href></Icon></IconStyle>' +
      '<LabelStyle><scale>1</scale></LabelStyle></Style>' +
      '    <StyleMap id="' + id + '">' +
      '<Pair><key>normal</key><styleUrl>#' + id + '-normal</styleUrl></Pair>' +
      '<Pair><key>highlight</key><styleUrl>#' + id + '-highlight</styleUrl></Pair>' +
      '</StyleMap>';
  }).join('\n');

  const placemarks = [...withGPS]
    .sort((a, b) => (a.timestamp < b.timestamp ? -1 : 1))
    .map(c => '    <Placemark>' +
      '<name>' + kx(trackerLocationLabel(c)) + '</name>' +
      '<description>' + kx((trackerTypeMeta(c.type).icon || '') + ' ' + (trackerTypeMeta(c.type).label || c.type) + ' · ' + fmtCheckinTime(c.timestamp)) + '</description>' +
      '<styleUrl>#ci-' + c.type + '</styleUrl>' +
      '<Point><coordinates>' + parseFloat(c.lng).toFixed(7) + ',' + parseFloat(c.lat).toFixed(7) + ',0</coordinates></Point>' +
      '</Placemark>')
    .join('\n');

  const kml = '<?xml version="1.0" encoding="UTF-8"?>' + '\n' +
    '<kml xmlns="http://www.opengis.net/kml/2.2">' + '\n' +
    '  <Document>' + '\n' +
    '    <name>' + kx(S.currentTrip.title) + '</name>' + '\n' +
    styles + '\n' +
    '  <Folder><name>' + kx(S.currentTrip.title) + '</name>\n' +
    placemarks + '\n' +
    '  </Folder>\n' +
    '  </Document>' + '\n' +
    '</kml>';

  const blob = new Blob([kml], { type: 'application/vnd.google-earth.kml+xml' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href     = url;
  a.download = S.currentTrip.title.replace(/[^\w\s-]/g, '') + '.kml';
  a.click();
  URL.revokeObjectURL(url);
  toast('KML exported!', 'ok');
}

function initTrackerMap() {
  const container = document.getElementById('tracker-map');
  if (!container) return;
  const withGPS = S.checkins.filter(c => c.lat && c.lng);
  if (!withGPS.length) {
    if (S.leafletMap) { (S.leafletMarkers || []).forEach(m => m.setMap(null)); S.leafletMarkers = []; if (S._routeLine) { S._routeLine.setMap(null); S._routeLine = null; } S.leafletMap = null; }
    container.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--muted);font-size:14px;padding:20px">No GPS data yet</div>';
    return;
  }
  if (!S.leafletMap) {
    container.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--muted);font-size:13px">Loading map…</div>';
  }
  loadGoogleMaps(() => _renderLeafletMap());
}

var _trackerRestoreInProgress = false;
function repairTrackerPlaceIds() {
  if (_trackerRestoreInProgress) return;
  _trackerRestoreInProgress = true;
  showModal('Repair map links', '<div id="placeIdRestoreStatus" style="font-size:13px;color:var(--muted)">Loading saved locations…</div>');
  google.script.run
    .withFailureHandler(err => { _trackerRestoreInProgress = false; showModal('Repair failed', '<div style="font-size:13px;color:var(--danger)">' + esc(err.message || String(err)) + '</div>'); })
    .withSuccessHandler(rows => {
      loadGoogleMaps(() => _searchMissingTrackerPlaceIds(rows || []));
    })
    .getCheckinsForGooglePlaceRepair();
}

function _searchMissingTrackerPlaceIds(rows) {
  const service = _getPlacesService();
  const updates = [], skipped = [], verifiedRows = [];
  let verified = 0;
  let index = 0;
  const status = document.getElementById('placeIdRestoreStatus');
  if (!rows.length) {
    _trackerRestoreInProgress = false;
    showModal('Repair map links', 'There are no saved check-ins to repair.', true);
    return;
  }
  const showFinalReport = updatedCount => {
    google.script.run
      .withFailureHandler(err => { _trackerRestoreInProgress = false; showModal('Repair failed', '<div style="font-size:13px;color:var(--danger)">' + esc(err.message || String(err)) + '</div>'); })
      .withSuccessHandler(latestRows => _showTrackerPlaceRestoreReport(updatedCount, verified, skipped, latestRows || [], verifiedRows))
      .getCheckinsForGooglePlaceRepair();
  };
  const finish = () => {
    if (!updates.length) { showFinalReport(0); return; }
    if (status) status.textContent = 'Saving ' + updates.length + ' corrected location' + (updates.length === 1 ? '' : 's') + '…';
    google.script.run
      .withFailureHandler(err => { _trackerRestoreInProgress = false; showModal('Repair failed', '<div style="font-size:13px;color:var(--danger)">' + esc(err.message || String(err)) + '</div>'); })
      .withSuccessHandler(result => {
        updates.forEach(update => {
          const checkin = (S.checkins || []).find(c => c.id === update.checkinId);
          if (checkin && (checkin.googlePlaceId || '') === update.previousPlaceId &&
              (checkin.googlePlaceName || '') === update.previousPlaceName) {
            checkin.googlePlaceId = update.placeId;
            checkin.googlePlaceName = update.placeName;
          }
        });
        showFinalReport(result.updated || 0);
      })
      .saveRepairedGooglePlaceIds(updates);
  };
  const next = () => {
    if (index >= rows.length) { finish(); return; }
    const row = rows[index++];
    if (status) status.textContent = 'Searching ' + index + ' of ' + rows.length + ': ' + row.name;
    const lat = Number(row.lat), lng = Number(row.lng);
    if (!row.name || !isFinite(lat) || !isFinite(lng)) {
      skipped.push({ row, reason: 'No saved name or coordinates', candidates: [] });
      setTimeout(next, 0);
      return;
    }
    const request = {
      query: row.name + (row.country ? ', ' + row.country : ''),
      location: { lat, lng }, radius: 5000
    };
    const toCandidates = results => (results || [])
        .map(place => {
          const point = place.geometry && place.geometry.location;
          const distance = point ? _trackerDistanceMeters(lat, lng,
            typeof point.lat === 'function' ? point.lat() : point.lat,
            typeof point.lng === 'function' ? point.lng() : point.lng) : Infinity;
          return { placeId: place.place_id, name: place.name || '', address: place.formatted_address || '', distance: Math.round(distance) };
        }).filter(place => place.placeId).sort((a, b) => a.distance - b.distance);
    const resolveCandidates = candidates => {
      const accepted = candidates.find(place => {
        // Exact place names can tolerate modest GPS drift (for example, an airport
        // pin recorded near a terminal). Partial/fuzzy matches still require a
        // very close coordinate match to avoid assigning a similarly named POI.
        const exactName = _trackerNormalizePlaceName(row.name) === _trackerNormalizePlaceName(place.name);
        const knownAlias = _trackerPlaceNameAliasMatch(row.name, place.name);
        return ((exactName || knownAlias) && place.distance <= 5000) ||
          (place.distance <= 200 && _trackerPlaceNamesMatch(row.name, place.name));
      });
      if (accepted) {
        verified++;
        verifiedRows.push({ tripId: row.tripId, checkinId: row.id, placeId: accepted.placeId });
        if (accepted.placeId !== row.googlePlaceId || accepted.name !== row.googlePlaceName) updates.push({
          tripId: row.tripId, checkinId: row.id,
          previousPlaceId: row.googlePlaceId || '', previousPlaceName: row.googlePlaceName || '',
          placeId: accepted.placeId, placeName: accepted.name
        });
      }
      else skipped.push({ row, reason: candidates.length ? 'No result matched both the saved name and GPS location' : 'Places search returned no results', candidates: candidates.slice(0, 3) });
      setTimeout(next, 0);
    };
    const hasAcceptedCandidate = candidates => candidates.some(place => {
      const exact = _trackerNormalizePlaceName(row.name) === _trackerNormalizePlaceName(place.name);
      return ((exact || _trackerPlaceNameAliasMatch(row.name, place.name)) && place.distance <= 5000) ||
        (place.distance <= 200 && _trackerPlaceNamesMatch(row.name, place.name));
    });
    const searchNearbyFallback = (keywords, candidatePool) => {
      if (!keywords.length) return resolveCandidates(candidatePool);
      const keyword = keywords.shift();
      service.nearbySearch({ keyword, location: { lat, lng }, radius: 5000 }, (nearbyResults, nearbyStatus) => {
        const nearby = toCandidates(nearbyStatus === google.maps.places.PlacesServiceStatus.OK ? nearbyResults : []);
        const byId = Object.create(null);
        candidatePool.concat(nearby).forEach(place => { byId[place.placeId] = place; });
        const combined = Object.keys(byId).map(id => byId[id]).sort((a, b) => a.distance - b.distance);
        if (hasAcceptedCandidate(combined) || !keywords.length) return resolveCandidates(combined);
        searchNearbyFallback(keywords, combined);
      });
    };
    const searchAliasText = (aliases, candidatePool) => {
      if (!aliases.length) return searchNearbyFallback([row.name].concat(_trackerPlaceNameAliases(row.name)), candidatePool);
      const alias = aliases.shift();
      service.textSearch({ query: alias + (row.country ? ', ' + row.country : ''), location: { lat, lng }, radius: 5000 }, (aliasResults, aliasStatus) => {
        const aliasCandidates = toCandidates(aliasStatus === google.maps.places.PlacesServiceStatus.OK ? aliasResults : []);
        const byId = Object.create(null);
        candidatePool.concat(aliasCandidates).forEach(place => { byId[place.placeId] = place; });
        const combined = Object.keys(byId).map(id => byId[id]).sort((a, b) => a.distance - b.distance);
        if (hasAcceptedCandidate(combined)) return resolveCandidates(combined);
        if (!aliases.length) return searchNearbyFallback([row.name].concat(_trackerPlaceNameAliases(row.name)), combined);
        searchAliasText(aliases, combined);
      });
    };
    service.textSearch(request, (results, searchStatus) => {
      const candidates = toCandidates(searchStatus === google.maps.places.PlacesServiceStatus.OK ? results : []);
      if (hasAcceptedCandidate(candidates)) return resolveCandidates(candidates);
      searchAliasText(_trackerPlaceNameAliases(row.name), candidates);
    });
  };
  next();
}

function _trackerPlaceNamesMatch(savedName, candidateName) {
  const saved = _trackerNormalizePlaceName(savedName), candidate = _trackerNormalizePlaceName(candidateName);
  if (!saved || !candidate) return false;
  if (saved === candidate || saved.indexOf(candidate) !== -1 || candidate.indexOf(saved) !== -1) return true;
  const savedWords = saved.split(/\s+/), candidateWords = candidate.split(/\s+/);
  const overlap = candidateWords.filter(word => savedWords.indexOf(word) !== -1).length;
  return candidateWords.length >= 2 && overlap / candidateWords.length >= 0.7;
}

function _trackerNormalizePlaceName(value) {
  return String(value || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
}

function _trackerPlaceNameAliasMatch(savedName, candidateName) {
  const saved = _trackerNormalizePlaceName(savedName), candidate = _trackerNormalizePlaceName(candidateName);
  if (saved === 'hotel praha' && candidate.indexOf('hotel praha liberec') === 0) return true;
  return _trackerPlaceNameAliasGroups().some(group => group.indexOf(saved) !== -1 && group.indexOf(candidate) !== -1);
}

function _trackerPlaceNameAliases(savedName) {
  const saved = _trackerNormalizePlaceName(savedName);
  if (saved === 'hotel praha') return ['hotel praha liberec'];
  const group = _trackerPlaceNameAliasGroups().find(names => names.indexOf(saved) !== -1);
  return group ? group.filter(name => name !== saved) : [];
}

function _trackerPlaceNameAliasGroups() {
  return [
    ['prachovske skaly', 'prachov cliffs'],
    ['stezka korunami stromu krkonose', 'the timber trail krkonose'],
    ['adrspasske skaly', 'adrspach rock formation'],
    ['wilde klamm', 'divoka souteska', 'wild gorge', 'pristaviste divoka souteska', 'kamenice gorge'],
    ['pravcicka brana', 'pravcicka archway'],
    ['vyhlidkova vez pastyrska stena', 'lookout tower shepherd s wall'],
    ['prague international airport prg', 'letiste vaclava havla praha']
  ];
}

function trackerLocationLabel(checkin) {
  const savedName = String(checkin && checkin.name || '').trim();
  const googleName = String(checkin && checkin.googlePlaceName || '').trim();
  const saved = _trackerNormalizePlaceName(savedName), google = _trackerNormalizePlaceName(googleName);
  const localizedNames = [
    { local: 'Prachovské skály', english: 'Prachov Cliffs', names: ['prachovske skaly', 'prachov cliffs'] },
    { local: 'Stezka korunami stromů Krkonoše', english: 'The Timber Trail, Krkonoše', names: ['stezka korunami stromu krkonose', 'the timber trail krkonose'] },
    { local: 'Adršpašské skály', english: 'Adršpach Rock Formation', names: ['adrspasske skaly', 'adrspach rock formation'] },
    { local: 'Divoká soutěska', english: 'Wild Gorge', names: ['wilde klamm', 'divoka souteska', 'wild gorge', 'pristaviste divoka souteska', 'kamenice gorge'] },
    { local: 'Pravčická brána', english: 'Pravčická Archway', names: ['pravcicka brana', 'pravcicka archway'] },
    { local: 'Vyhlídková věž Pastýřská stěna', english: "Lookout Tower Shepherd's Wall", names: ['vyhlidkova vez pastyrska stena', 'lookout tower shepherd s wall'] },
    { local: 'Letiště Václava Havla Praha', english: 'Prague International Airport', names: ['prague international airport prg', 'prague international airport', 'letiste vaclava havla praha'] }
  ];
  const localized = localizedNames.find(item => item.names.indexOf(saved) !== -1 || item.names.indexOf(google) !== -1);
  if (localized) return localized.local + ' (' + localized.english + ')';
  if (!googleName || !google || saved === google) return savedName;
  return savedName + ' (' + googleName + ')';
}

function _trackerDistanceMeters(lat1, lng1, lat2, lng2) {
  const rad = Math.PI / 180, dLat = (lat2 - lat1) * rad, dLng = (lng2 - lng1) * rad;
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * rad) * Math.cos(lat2 * rad) * Math.sin(dLng / 2) ** 2;
  return 6371000 * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function _showTrackerPlaceRestoreReport(updatedCount, verifiedCount, skipped, latestRows, verifiedRows) {
  _trackerRestoreInProgress = false;
  let html = '<div style="font-size:13px;margin-bottom:8px">Verified ' + verifiedCount + ' location' + (verifiedCount === 1 ? '' : 's') + '; corrected ' + updatedCount + ' Place ID' + (updatedCount === 1 ? '' : 's') + '; left ' + skipped.length + ' unmatched location' + (skipped.length === 1 ? '' : 's') + ' unchanged.</div>';
  const czechRows = latestRows.filter(row => /czech/i.test(row.country || ''));
  if (czechRows.length) {
    const verifiedByKey = Object.create(null), skippedByKey = Object.create(null);
    (verifiedRows || []).forEach(item => { verifiedByKey[item.tripId + '|' + item.checkinId] = item.placeId; });
    skipped.forEach(item => { skippedByKey[item.row.tripId + '|' + item.row.id] = item; });
    const czechStatus = czechRows.map(row => {
      const key = row.tripId + '|' + row.id, id = row.googlePlaceId || '';
      return { row, id, verified: !!id && verifiedByKey[key] === id, skipped: skippedByKey[key] || null };
    });
    const confirmed = czechStatus.filter(item => item.verified).length;
    const withUnverifiedId = czechStatus.filter(item => item.id && !item.verified).length;
    const missingId = czechStatus.filter(item => !item.id).length;
    html += '<div style="border:1px solid var(--border);border-radius:8px;padding:9px 10px;margin:8px 0;font-size:12px"><b>Czech locations:</b> ' + czechRows.length + ' total; ' + confirmed + ' have a Place ID confirmed by this lookup; ' + withUnverifiedId + ' have an ID but could not be confirmed; ' + missingId + ' are missing an ID.';
    const unresolved = czechStatus.filter(item => !item.verified);
    if (unresolved.length) html += '<div style="margin-top:6px">' + unresolved.map(item =>
      '<div style="padding-top:4px"><b>' + esc(item.row.name || '(unnamed)') + '</b> — ' +
      (item.id ? 'ID present, lookup not confirmed' : 'missing ID') +
      (item.skipped && item.skipped.candidates.length ? '<div style="color:var(--muted)">' + item.skipped.candidates.map(candidate => esc(candidate.name) + ' (' + candidate.distance + ' m)').join('; ') + '</div>' : '') +
      '</div>').join('') + '</div>';
    html += '</div>';
  }
  if (skipped.length) html += '<div style="max-height:45vh;overflow-y:auto">' + skipped.map(item =>
    '<div style="border-top:1px solid var(--border);padding:8px 0;font-size:12px"><b>' + esc(item.row.name || '(unnamed)') + '</b>' +
    '<div style="color:var(--muted)">' + esc(item.row.tripTitle || '') + ' · ' + esc(item.row.country || '') + '</div>' +
    '<div style="color:var(--muted)">' + esc(item.reason) + '</div>' +
    (item.candidates.length ? '<div style="margin-top:3px">' + item.candidates.map(candidate =>
      esc(candidate.name) + ' — ' + esc(candidate.address) + ' (' + candidate.distance + ' m)').join('<br>') + '</div>' : '') +
    '</div>').join('') + '</div>';
  showModal('Repair map links', html, true);
}

function _renderLeafletMap() {
  const container = document.getElementById('tracker-map');
  if (!container) return;
  const withGPS = trackerRouteOrder(S.checkins.filter(c => c.lat && c.lng));
  (S.leafletMarkers || []).forEach(m => m.setMap(null));
  S.leafletMarkers = [];
  if (S._routeLine) { S._routeLine.setMap(null); S._routeLine = null; }
  if (!S.leafletMap) {
    container.innerHTML = '';
    S.leafletMap = new google.maps.Map(container, {
      center: { lat: parseFloat(withGPS[0].lat), lng: parseFloat(withGPS[0].lng) },
      zoom: 10, mapTypeControl: false, streetViewControl: false, fullscreenControl: false, gestureHandling: 'greedy'
    });
    S.leafletMap.addListener('click', function() {
      if (S._trackerInfoWindow) S._trackerInfoWindow.close();
      S._trackerOpenCheckinId = null;
    });
  }
  if (withGPS.length > 1) {
    S._routeLine = new google.maps.Polyline({
      path: withGPS.map(c => ({ lat: parseFloat(c.lat), lng: parseFloat(c.lng) })),
      strokeColor: '#1565C0', strokeOpacity: 0.55, strokeWeight: 2.5, map: S.leafletMap
    });
  }
  S._trackerInfoWindow = new google.maps.InfoWindow({ maxWidth: 280 });
  const infoWindow = S._trackerInfoWindow;
  const bounds = new google.maps.LatLngBounds();
  withGPS.forEach((c, i) => {
    const typeMeta = trackerTypeMeta(c.type);
    const col = typeMeta.color || '#9E9E9E';
    const marker = new google.maps.Marker({
      position: { lat: parseFloat(c.lat), lng: parseFloat(c.lng) },
      map: S.leafletMap,
      icon: { path: google.maps.SymbolPath.CIRCLE, fillColor: col, fillOpacity: 1, strokeColor: '#fff', strokeWeight: 2.5, scale: 14 },
      label: { text: String(i + 1), color: '#fff', fontSize: '11px', fontWeight: '700' },
      title: trackerLocationLabel(c)
    });
    marker._checkinId = c.id;
    marker.addListener('click', () => {
      S._trackerOpenCheckinId = c.id;
      const photoUrl = _trackerPhotoCache[c.id];
      const mapsUrl = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(c.name || '') +
        (c.googlePlaceId ? '&query_place_id=' + encodeURIComponent(c.googlePlaceId) : '');
      infoWindow.setContent(
        '<div style="position:relative;width:260px;max-width:100%;background:#fff;border-radius:10px;overflow:hidden;font-family:Arial,sans-serif">' +
          '<button type="button" aria-label="Close location details" onclick="S._trackerOpenCheckinId=null;S._trackerInfoWindow.close()" style="position:absolute;top:0;right:0;background:rgba(255,255,255,.92);border:0;border-radius:0 0 0 8px;font-size:22px;line-height:1;cursor:pointer;color:#667085;z-index:1;padding:7px 11px">&times;</button>' +
          (photoUrl ? '<div style="height:80px;overflow:hidden;background:#e5e7eb"><img src="' + esc(photoUrl) + '" style="width:100%;height:100%;object-fit:cover" loading="lazy" onerror="this.parentNode.style.display=\'none\'"></div>' : '') +
          '<div style="padding:10px 14px 2px;padding-right:40px;font-weight:700;font-size:13px;line-height:1.4;color:#1A1A2E;overflow-wrap:anywhere">' + esc(trackerLocationLabel(c)) + '</div>' +
          '<div style="padding:0 14px 3px;font-size:11px;line-height:1.5;color:' + col + '">' + (typeMeta.icon || '') + ' ' + esc(typeMeta.label || c.type || '') + '</div>' +
          '<div style="padding:0 14px 9px;font-size:11px;color:#667085">' + fmtCheckinTime(c.timestamp) + '</div>' +
          '<div style="border-top:1px solid #E5E7EB;display:flex;align-items:center">' +
            '<button onclick="S._trackerInfoWindow.close();editCheckinUI(\'' + c.id + '\')" style="flex:1;padding:8px 10px;background:none;border:0;cursor:pointer;font-size:12px;font-weight:600;color:#1565C0">✏ Edit</button>' +
            '<a href="' + esc(mapsUrl) + '" target="_blank" rel="noopener" style="flex:1;padding:8px 10px;border-left:1px solid #E5E7EB;text-align:center;font-size:12px;font-weight:600;color:#667085;text-decoration:none">🗺️ Google Maps</a>' +
          '</div>' +
        '</div>'
      );
      infoWindow.open(S.leafletMap, marker);
      if (photoUrl === undefined && c.name) _fetchTrackerMapPhoto(c);
    });
    S.leafletMarkers.push(marker);
    bounds.extend({ lat: parseFloat(c.lat), lng: parseFloat(c.lng) });
  });
  S.leafletMap.fitBounds(bounds);
  google.maps.event.addListenerOnce(S.leafletMap, 'bounds_changed', () => {
    if (S.leafletMap.getZoom() > 14) S.leafletMap.setZoom(14);
  });
}

function trackerRouteOrder(checkins) {
  const byDay = {};
  checkins.forEach(checkin => {
    const day = localDateStr(checkin.timestamp);
    if (!byDay[day]) byDay[day] = [];
    byDay[day].push(checkin);
  });
  const route = [];
  const included = new Set();
  let lastNightLodging = null;
  Object.keys(byDay).sort().forEach(day => {
    const daily = byDay[day].sort(compareCheckinsByTime);
    const lodgings = daily.filter(checkin => checkin.type === 'hotel');
    // A lodging recorded on the prior evening is the next morning's route start.
    if (lastNightLodging && !included.has(lastNightLodging.id)) {
      route.push(lastNightLodging);
      included.add(lastNightLodging.id);
    }
    daily.forEach(checkin => { if (checkin.type !== 'hotel') route.push(checkin); });
    // As in the calendar, use the last lodging recorded on this date for the night.
    if (lodgings.length) lastNightLodging = lodgings[lodgings.length - 1];
  });
  // Keep the final night's lodging as the trip's last route point if there is no
  // following day whose morning can consume it.
  if (lastNightLodging && !included.has(lastNightLodging.id)) route.push(lastNightLodging);
  return route;
}

function _fetchTrackerMapPhoto(checkin) {
  _trackerPhotoCache[checkin.id] = null;
  loadGoogleMaps(() => {
    const service = _getPlacesService();
    if (!service) return;
    const request = { query: checkin.name, fields: ['photos'] };
    const lat = parseFloat(checkin.lat), lng = parseFloat(checkin.lng);
    if (!isNaN(lat) && !isNaN(lng)) request.locationBias = { lat, lng };
    service.findPlaceFromQuery(request, (results, status) => {
      if (status === 'OK' && results && results[0]) {
        _trackerPhotoCache[checkin.id] = results[0].photos && results[0].photos.length
          ? results[0].photos[0].getUrl({ maxWidth: 640, maxHeight: 160 }) : null;
      } else {
        _trackerPhotoCache[checkin.id] = null;
      }
      if (S._trackerOpenCheckinId === checkin.id) {
        const marker = (S.leafletMarkers || []).find(m => m._checkinId === checkin.id);
        if (marker) google.maps.event.trigger(marker, 'click');
      }
    });
  });
}

function localDateStr(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  return d.getFullYear() + '-' +
    String(d.getMonth() + 1).padStart(2, '0') + '-' +
    String(d.getDate()).padStart(2, '0');
}

function fmtCheckinTime(ts) {
  if (!ts) return '';
  try {
    return new Date(ts).toLocaleString('en-US', {
      month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
    });
  } catch(e) { return ts; }
}
