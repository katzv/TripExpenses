// Resolves a usable {first, last} day range for the assign-by-day calendars, falling
// back to the assigned-day range when the trip has no start/end date set (mirrors
// buildPlannerCalendar's own fallback). Returns null if nothing usable exists.
function _planDateRange() {
  const allAssigned = Object.keys(S.planAssignments).filter(d => S.planAssignments[d] && S.planAssignments[d].length);
  let first = S.currentTrip.startDate || null;
  let last  = S.currentTrip.endDate   || null;
  if (!first && allAssigned.length) first = allAssigned.sort()[0];
  if (!last  && allAssigned.length) last  = allAssigned.sort()[allAssigned.length - 1];
  if (!first) return null;
  if (!last) last = first;
  return { first, last };
}

function openDayPickerForPlace(placeId) {
  const p = S.planBank.find(x => x.id === placeId);
  if (!p) return;
  if (S._planInfoWindow) S._planInfoWindow.close();

  const range = _planDateRange();
  if (!range) { toast('Set trip dates or assign a place to a day first', 'err'); return; }
  const start = range.first, end = range.last;

  const t = LOCATION_TYPES[p.type] || { icon: '📌', color: '#9E9E9E', label: p.type };
  const color = t.color;

  const assignedSet = new Set(
    Object.keys(S.planAssignments).filter(ds => (S.planAssignments[ds] || []).indexOf(placeId) !== -1)
  );

  let html = '<div style="max-height:62vh;overflow-y:auto;padding-right:2px">';
  html += _buildTripCalendarGrid(start, end, ds => {
    const on = assignedSet.has(ds);
    return '<div onclick="toggleDayCell(\'' + placeId + '\',\'' + ds + '\',\'' + color + '\',this)" ' +
      'style="font-size:11px;text-align:center;padding:5px 2px;border-radius:5px;cursor:pointer;user-select:none;' +
      (on ? 'background:' + color + '33;border:1.5px solid ' + color + ';color:' + color + ';font-weight:700'
          : 'background:transparent;border:1.5px solid var(--border);color:var(--text);font-weight:400') +
      '">' + parseInt(ds.slice(-2), 10) + '</div>';
  });
  html += '</div>';
  html += '<div style="font-size:10px;color:var(--muted);text-align:center;margin:6px 0 8px">Tap to assign · tap again to unassign</div>';
  const _btnBase = 'font-size:11px;padding:5px 10px;border-radius:7px;cursor:pointer;font-weight:600;white-space:nowrap';
  html += '<div style="display:flex;gap:6px;justify-content:flex-end">' +
    '<button style="' + _btnBase + ';background:none;border:1.5px solid #EF4444;color:#EF4444" onclick="closeModal();confirmDeletePlanPlace(\'' + placeId + '\')">✕ Remove</button>' +
    '<button style="' + _btnBase + ';background:none;border:1.5px solid var(--primary);color:var(--primary)" onclick="closeModal();editPlanPlace(\'' + placeId + '\')">✏️ Edit</button>' +
    '<button style="' + _btnBase + ';background:var(--primary);border:1.5px solid var(--primary);color:#fff" onclick="closeModal()">Done</button>' +
    '</div>';

  showModal(t.icon + ' ' + esc(p.name), html);
}

function toggleDayCell(placeId, ds, color, el) {
  const cur = S.planAssignments[ds] || [];
  const on = cur.indexOf(placeId) !== -1;
  if (on) {
    S.planAssignments[ds] = cur.filter(id => id !== placeId);
    if (!S.planAssignments[ds].length) delete S.planAssignments[ds];
    el.style.background = 'transparent'; el.style.borderColor = 'var(--border)';
    el.style.color = 'var(--text)'; el.style.fontWeight = '400';
    google.script.run
      .withFailureHandler(err => toast('Sync error: ' + err.message, 'err'))
      .removePlaceFromDay(S.currentTrip.id, ds, placeId);
  } else {
    S.planAssignments[ds] = cur.concat(placeId);
    el.style.background = color + '33'; el.style.borderColor = color;
    el.style.color = color; el.style.fontWeight = '700';
    google.script.run
      .withFailureHandler(err => toast('Sync error: ' + err.message, 'err'))
      .setPlanDayAssignment(S.currentTrip.id, ds, S.planAssignments[ds]);
  }
  if (S.plannerTab === 'cal') buildPlannerCalendar();
}

// ---- Planner map ----

var _markerRCTime = 0;    // timestamp of last bank-marker rightclick
var _markerClickTime = 0; // timestamp of last bank-marker left-click
var _deleteConfirmOutsideHandler = null;
var _lpTimer = null, _lpTouch = null, _lpFired = false, _lpTime = 0; // long-press state (map markers)
var _calLpTimer = null, _calLpFired = false; // long-press state (calendar pills)

function initPlannerMap(fitAll) {
  const container = document.getElementById('planner-map');
  if (!container) return;
  renderBankBarChips();
  const withGPS = S.planBank.filter(hasGpsCoords);
  if (!S.plannerMap) {
    container.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--muted);font-size:13px">Loading map...</div>';
  }
  loadGoogleMaps(() => _renderPlannerLeaflet());
}

function _renderPlannerLeaflet() {
  const container = document.getElementById('planner-map');
  if (!container) return;
  const withGPS = S.planBank.filter(hasGpsCoords);
  (S.plannerMarkers || []).forEach(m => m.setMap(null));
  S.plannerMarkers = [];

  const _isNewMap = !S.plannerMap;
  if (!S.plannerMap) {
    container.innerHTML = '';
    const countryCenters = _getTripCountryCenters();
    S.plannerMap = new google.maps.Map(container, {
      center: withGPS.length
        ? { lat: parseFloat(withGPS[0].lat), lng: parseFloat(withGPS[0].lng) }
        : (countryCenters[0] || { lat: 30, lng: 20 }),
      zoom: withGPS.length ? 10 : (countryCenters.length === 1 ? 6 : 2),
      mapTypeControl: false, streetViewControl: false, fullscreenControl: false, gestureHandling: 'greedy'
    });

    // Click on map: suppress Google's POI info card, deselect chip, close context menu
    S.plannerMap.addListener('click', function(e) {
      if (e.placeId) e.stop(); // prevent Google's built-in POI popup
      if (Date.now() - _markerClickTime < 300) return; // bank marker click already opened Pin Menu
      if (Date.now() - _lpTime < 800) return; // long-press just opened Place Menu — don't close it
      if (S._planInfoWindow) S._planInfoWindow.close();
      _hideContextMenu();
      _clearPlaceHighlight();
    });

    // Reposition context menus when map pans/zooms
    S.plannerMap.addListener('bounds_changed', _repositionContextMenu);

    // Shared handler for right-click and long-press: detect POI via nearbySearch then show menu
    function _handleMapContextAt(cx, cy) {
      if (Date.now() - _markerRCTime < 300) return; // bank marker already showed Pin Menu
      if (S._planInfoWindow) S._planInfoWindow.close();
      const savedCenter = S.plannerMap ? S.plannerMap.getCenter() : null;
      const coords = _pixelToLatLng(S.plannerMap, cx, cy);
      if (!coords) return;
      if (savedCenter) setTimeout(() => { if (S.plannerMap) S.plannerMap.setCenter(savedCenter); }, 30);
      const menu = document.getElementById('plannerContextMenu');
      if (menu) {
        menu.innerHTML = '<button onclick="_hideContextMenu()" style="position:absolute;top:0;right:0;background:none;border:none;font-size:22px;line-height:1;cursor:pointer;color:var(--muted);z-index:1;padding:10px 12px;min-width:44px;min-height:44px;display:flex;align-items:center;justify-content:center">×</button><div style="padding:10px 14px;padding-right:40px;font-size:12px;color:var(--muted)">Loading…</div>';
        const menuW = 250, vw = window.innerWidth;
        menu.style.left = (cx + menuW > vw - 8 ? Math.max(8, cx - menuW) : cx) + 'px';
        menu.style.top  = Math.min(cy, window.innerHeight - 140) + 'px';
        menu.style.display = 'block';
        menu._anchorLat = coords ? coords.lat : null;
        menu._anchorLng = coords ? coords.lng : null;
      }
      loadGoogleMaps(() => {
        const svc = _getPlacesService();
        if (!svc) { _showContextMenu(cx, cy, coords, null); return; }
        const zoom = S.plannerMap.getZoom() || 14;
        const radius = Math.max(20, Math.min(120, Math.round(800 / Math.pow(2, zoom - 12))));
        svc.nearbySearch({ location: coords, radius: radius }, function(results, status) {
          let placeId = null;
          if (status === google.maps.places.PlacesServiceStatus.OK && results) {
            const skipTypes = new Set(['locality','political','country','colloquial_area',
              'administrative_area_level_1','administrative_area_level_2',
              'administrative_area_level_3','administrative_area_level_4','natural_feature',
              'route','street_address','postal_code']);
            const poi = results.find(r => r.types && !r.types.some(t => skipTypes.has(t)));
            placeId = poi ? poi.place_id : null;
          }
          console.log('[NEARBY] status:', status, '| results:', results ? results.length : 0, '| placeId:', placeId, '| radius:', radius);
          _showContextMenu(cx, cy, coords, placeId);
        });
      });
    }

    // Desktop: right-click fires contextmenu
    container.addEventListener('contextmenu', function(domEvt) {
      domEvt.preventDefault();
      _handleMapContextAt(domEvt.clientX, domEvt.clientY);
    });

    // Mobile: long press (600ms hold without moving) fires the same menu
    container.addEventListener('touchstart', function(e) {
      if (e.touches.length !== 1) return;
      const t = e.touches[0];
      _lpTouch = { x: t.clientX, y: t.clientY };
      _lpFired = false;
      _lpTimer = setTimeout(function() {
        if (!_lpTouch) return;
        _lpFired = true;
        _lpTime = Date.now(); // mark long-press time to suppress the following map click
        if ('vibrate' in navigator) navigator.vibrate(50); // haptic feedback
        _handleMapContextAt(_lpTouch.x, _lpTouch.y);
      }, 600);
    }, { passive: true });

    container.addEventListener('touchmove', function(e) {
      if (!_lpTimer || !_lpTouch) return;
      const t = e.touches[0];
      if (Math.abs(t.clientX - _lpTouch.x) > 10 || Math.abs(t.clientY - _lpTouch.y) > 10) {
        clearTimeout(_lpTimer); _lpTimer = null; _lpTouch = null;
      }
    }, { passive: true });

    container.addEventListener('touchend', function(e) {
      clearTimeout(_lpTimer); _lpTimer = null; _lpTouch = null;
      if (_lpFired) {
        _lpTime = Date.now(); // re-stamp so the 800ms guard covers however long the user held
        e.preventDefault();
        _lpFired = false;
      }
    });
  }

  S._planInfoWindow = new google.maps.InfoWindow({ maxWidth: 300 });
  const infoWindow = S._planInfoWindow;
  const bounds = new google.maps.LatLngBounds();

  withGPS.forEach(p => {
    const marker = new google.maps.Marker({
      position: { lat: parseFloat(p.lat), lng: parseFloat(p.lng) },
      map: S.plannerMap,
      title: p.name
    });
    marker._placeId = p.id; // bank place id for bar highlight
    S.plannerMarkers.push(marker);
    _updateMarkerIcon(p.id); // sets icon/label/zIndex (and bounce if already highlighted) in one place

    marker.addListener('click', (e) => {
      _markerClickTime = Date.now(); // prevent map click handler from closing the menu we're about to open
      if (S._planInfoWindow) S._planInfoWindow.close();
      _setPlaceHighlight(p.id);
      const de = e.domEvent;
      let cx = window.innerWidth / 2, cy = window.innerHeight / 3;
      if (de) {
        if (de.clientX !== undefined) { cx = de.clientX; cy = de.clientY; }
        else if (de.changedTouches && de.changedTouches.length) { cx = de.changedTouches[0].clientX; cy = de.changedTouches[0].clientY; }
      }
      showPinMenu(p.id, cx, cy);
    });

    marker.addListener('rightclick', (e) => {
      _markerRCTime = Date.now();
      if (S._planInfoWindow) S._planInfoWindow.close();
      _setPlaceHighlight(p.id);
      const de = e.domEvent;
      let cx = window.innerWidth / 2, cy = window.innerHeight / 3;
      if (de) {
        if (de.clientX !== undefined) { cx = de.clientX; cy = de.clientY; }
        else if (de.changedTouches && de.changedTouches.length) { cx = de.changedTouches[0].clientX; cy = de.changedTouches[0].clientY; }
      }
      showPinMenu(p.id, cx, cy);
    });

    bounds.extend({ lat: parseFloat(p.lat), lng: parseFloat(p.lng) });
  });

  google.maps.event.trigger(S.plannerMap, 'resize');
  if (withGPS.length && (_isNewMap || fitAll)) {
    S.plannerMap.fitBounds(bounds, { top: 60, right: 50, bottom: 50, left: 50 });
    google.maps.event.addListenerOnce(S.plannerMap, 'bounds_changed', () => {
      if (S.plannerMap.getZoom() > 14) S.plannerMap.setZoom(14);
    });
  } else if (!withGPS.length) {
    const countryCenters = _getTripCountryCenters();
    if (countryCenters.length > 1) {
      const countryBounds = new google.maps.LatLngBounds();
      countryCenters.forEach(center => countryBounds.extend(center));
      S.plannerMap.fitBounds(countryBounds, { top: 60, right: 50, bottom: 50, left: 50 });
      google.maps.event.addListenerOnce(S.plannerMap, 'bounds_changed', () => {
        if (S.plannerMap.getZoom() > 7) S.plannerMap.setZoom(7);
      });
    } else if (countryCenters.length === 1) {
      S.plannerMap.setCenter(countryCenters[0]);
      S.plannerMap.setZoom(6);
    } else {
      S.plannerMap.setCenter({ lat: 30, lng: 20 });
      S.plannerMap.setZoom(2);
    }
  }
  renderBankBarChips();

  if (S._planPendingFocus) {
    const pf = S._planPendingFocus;
    S._planPendingFocus = null;
    setTimeout(() => {
      if (S.plannerMap) {
        S.plannerMap.panTo({ lat: pf.lat, lng: pf.lng });
        if (S.plannerMap.getZoom() < 13) S.plannerMap.setZoom(13);
        const bar = document.getElementById('planBankBar');
        if (bar && bar.offsetHeight) S.plannerMap.panBy(0, -Math.round(bar.offsetHeight / 2));
      }
    }, 150);
  }

  if (S._planPendingHighlight) {
    const hid = S._planPendingHighlight;
    S._planPendingHighlight = null;
    setTimeout(() => {
      _setPlaceHighlight(hid);
      _centerMapOnPlace(hid);
    }, 150);
  }
}

// ---- Context menu ----

function _showContextMenu(x, y, coords, placeId) {
  const menu = document.getElementById('plannerContextMenu');
  if (!menu) return;
  menu.innerHTML = '<div style="padding:10px 14px;font-size:12px;color:var(--muted)">Loading…</div>';

  // Position: avoid viewport edges
  const vw = window.innerWidth;
  const menuW = 250;
  menu.style.left = (x + menuW > vw - 8 ? Math.max(8, x - menuW) : x) + 'px';
  menu.style.top = Math.min(y, window.innerHeight - 140) + 'px';
  menu.style.display = 'block';

  if (placeId) {
    loadGoogleMaps(() => {
      _getPlacesService().getDetails(
        { placeId, fields: ['name', 'formatted_address', 'url', 'types', 'geometry', 'website', 'formatted_phone_number', 'editorial_summary', 'business_status', 'photos'] },
        function(place, status) {
          console.log('[DETAIL] status:', status, '| name:', place ? place.name : null);
          if (status === 'OK' && place && place.geometry) {
            const loc = place.geometry.location;
            const typeKey = _googleTypeToPlanner(place.types || []);
            const pt = LOCATION_TYPES[typeKey] || { icon: '📍', label: typeKey || 'Place' };
            const photoUrl = (place.photos && place.photos.length)
              ? place.photos[0].getUrl({ maxWidth: 320, maxHeight: 160 }) : null;
            const bizStatus = place.business_status || 'OPERATIONAL';
            S._ctxMenuData = {
              coords: { lat: loc.lat(), lng: loc.lng() },
              name: place.name || '',
              type: typeKey,
              placeId: placeId,
              address: place.formatted_address || '',
              website: place.website || '',
              phone: place.formatted_phone_number || '',
              summary: (place.editorial_summary && place.editorial_summary.overview) || '',
              photoUrl, bizStatus
            };
            _renderContextMenu(menu, {
              name: place.name,
              typeLine: pt.icon + ' ' + pt.label,
              address: place.formatted_address,
              website: place.website || null,
              phone: place.formatted_phone_number || null,
              summary: (place.editorial_summary && place.editorial_summary.overview) || null,
              mapsUrl: place.url || null,
              photoUrl, bizStatus
            });
          } else {
            S._ctxMenuData = { coords, name: '', type: '', placeId: null, address: null };
            _geocodeAndRenderMenu(menu, coords);
          }
        }
      );
    });
  } else if (coords) {
    S._ctxMenuData = { coords, name: '', type: '' };
    _geocodeAndRenderMenu(menu, coords);
  } else {
    menu.style.display = 'none'; // no location info available
  }
}

function _geocodeAndRenderMenu(menu, coords) {
  if (!coords) { menu.style.display = 'none'; return; }
  _renderContextMenu(menu, { address: coords.lat.toFixed(5) + ', ' + coords.lng.toFixed(5) });
}

function _renderContextMenu(menu, opts) {
  const { name, typeLine, address, website, phone, summary, mapsUrl,
          photoUrl, bizStatus } = opts;
  const data = S._ctxMenuData || {};
  const c = data.coords || {};
  const gmUrl = mapsUrl || ('https://maps.google.com/?q=' + (c.lat == null ? 0 : c.lat) + ',' + (c.lng == null ? 0 : c.lng));

  // Business status badge
  let statusBadge = '';
  if (bizStatus === 'CLOSED_PERMANENTLY')

    (name     ? '<div style="padding:10px 14px 2px;padding-right:40px;font-weight:700;font-size:13px;color:var(--text)">' + esc(name) + '</div>' : '') +

    (address  ? '<div style="padding:3px 14px 2px;font-size:11px;color:var(--muted)">📍 ' + esc(address) + '</div>' : '') +
    (webShort ? '<div style="padding:2px 14px 2px;font-size:11px"><a href="' + esc(website) + '" target="_blank" rel="noopener" style="color:var(--primary);text-decoration:none">🌐 ' + esc(webShort) + '</a></div>' : '') +
    (phone    ? '<div style="padding:2px 14px 7px;font-size:11px;color:var(--muted)">📞 ' + esc(phone) + '</div>' : '');

  // Info section max-height: leave room for photo (120px if present) + buttons (~90px) + margin (40px)
  const infoMaxH = 'calc(100vh - ' + (photoUrl ? 250 : 130) + 'px)';

  menu.innerHTML =
    '<button onclick="_hideContextMenu()" style="position:absolute;top:0;right:0;background:none;border:none;font-size:22px;line-height:1;cursor:pointer;color:var(--muted);z-index:1;padding:10px 12px;min-width:44px;min-height:44px;display:flex;align-items:center;justify-content:center">×</button>' +
    (photoUrl ? '<div style="height:120px;overflow:hidden;background:#e5e7eb"><img src="' + esc(photoUrl) + '" style="width:100%;height:100%;object-fit:cover" loading="lazy" onerror="this.parentNode.style.display=\'none\'"></div>' : '') +
    '<div style="max-height:' + infoMaxH + ';overflow-y:auto">' + infoHtml + '</div>' +
    '<div style="border-top:1px solid var(--border)">' +
    '<button onclick="_contextMenuAddToBank()" style="display:block;width:100%;padding:10px 14px;text-align:left;background:none;border:none;cursor:pointer;font-size:13px;font-weight:600;color:var(--primary)">+ Add to Bank</button>' +
    '<a href="' + esc(gmUrl) + '" target="_blank" rel="noopener" style="display:block;padding:10px 14px;font-size:13px;font-weight:600;color:var(--muted);text-decoration:none;border-top:1px solid var(--border)">&#127758; View on Google Maps</a>' +
    '</div>';

  // Post-render: clamp position so menu stays fully in viewport
  setTimeout(() => {
    const rect = menu.getBoundingClientRect();
    if (rect.bottom > window.innerHeight - 4)
      menu.style.top = Math.max(4, window.innerHeight - rect.height - 4) + 'px';
  }, 0);
}

function _hideContextMenu() {

// Simple linear interpolation from screen pixel to lat/lng.
// Accurate enough for geocoding / context-menu use at typical zoom levels.
function _pixelToLatLng(map, cx, cy) {
  if (!map) return null;
  const bounds = map.getBounds();
  if (!bounds) return null;
  const div = map.getDiv();
  if (!div) return null;
  const rect = div.getBoundingClientRect();
  const relX = (cx - rect.left)  / rect.width;
  const relY = (cy - rect.top)   / rect.height;
  const ne = bounds.getNorthEast(), sw = bounds.getSouthWest();
  return {
    lat: ne.lat() - relY * (ne.lat() - sw.lat()),
    lng: sw.lng() + relX * (ne.lng() - sw.lng())
  };
}

// Reverse: lat/lng to viewport pixel. Used to track context menu anchor on map pan.
function _latLngToPixel(map, lat, lng) {
  if (!map) return null;
  const bounds = map.getBounds();
  if (!bounds) return null;
  const div = map.getDiv();
  if (!div) return null;
  const rect = div.getBoundingClientRect();
  const ne = bounds.getNorthEast(), sw = bounds.getSouthWest();
  const dLng = ne.lng() - sw.lng(), dLat = ne.lat() - sw.lat();
  if (!dLng || !dLat) return null;
  return {
    x: rect.left + (lng - sw.lng()) / dLng * rect.width,
    y: rect.top  + (ne.lat() - lat) / dLat * rect.height
  };
}

// Reposition the open context menu so it stays anchored to its map LatLng on pan/zoom.
function _repositionContextMenu() {
  const menu = document.getElementById('plannerContextMenu');
  if (!menu || menu.style.display === 'none') return;
  const lat = menu._anchorLat, lng = menu._anchorLng;
  if (lat == null || lng == null || !S.plannerMap) return;
  const pt = _latLngToPixel(S.plannerMap, lat, lng);
  if (!pt) return;
  const menuW = 260, vw = window.innerWidth;
  menu.style.left = (vw - pt.x - 8 >= menuW ? pt.x + 4 : Math.max(8, pt.x - menuW - 4)) + 'px';
  const mh = menu.offsetHeight || 280;
  menu.style.top  = Math.max(4, Math.min(pt.y, window.innerHeight - mh - 4)) + 'px';
}

// ---- Planner place name suggestions ----

function onPlanNameFocus() {
  if (S._suppressSuggestOnFocus) { S._suppressSuggestOnFocus = false; return; }
  const q = (document.getElementById('planName').value || '').trim();
  if (!q && S.planGpsCoords) fetchPlanNearbySuggestions();
}

function onPlanNameInput() {
  const q = (document.getElementById('planName').value || '').trim();
  const searchSequence = ++_plannerSearchSequence;
  clearTimeout(S.planSuggestTimer);
  if (!q) {
    if (S.planGpsCoords) fetchPlanNearbySuggestions();
    else hidePlanSuggestions();
    return;
  }
  S.planSuggestTimer = setTimeout(() => searchPlanByName(q, searchSequence), 600);
}

var _plannerSearchSequence = 0;

function fetchPlanNearbySuggestions() {
  if (!S.planGpsCoords) return;
  const requestSequence = _plannerSearchSequence;
  const { lat, lng } = S.planGpsCoords;
  loadGoogleMaps(() => {
    const svc = _getPlacesService();
    if (!svc) return;
    svc.nearbySearch({ location: { lat, lng }, radius: 600 }, (results, status) => {
      if (requestSequence !== _plannerSearchSequence || (document.getElementById('planName').value || '').trim()) return;
      if (status !== google.maps.places.PlacesServiceStatus.OK || !results) return;
      const items = results.slice(0, 8).map(r => ({
        place_id: r.place_id,
        name: r.name,
        sub: (r.types || []).slice(0, 2).join(', ').replace(/_/g, ' '),
        lat: r.geometry.location.lat(), lng: r.geometry.location.lng()
      }));
      if (items.length) showPlanSuggestions(items);
    });
  });
}

function searchPlanByName(q, sequence) {
  const requestSequence = sequence == null ? ++_plannerSearchSequence : sequence;
  const isCurrentQuery = () => requestSequence === _plannerSearchSequence &&
    (document.getElementById('planName').value || '').trim() === q;
  loadGoogleMaps(() => {
    if (!isCurrentQuery()) return;
    const svc = new google.maps.places.AutocompleteService();
    svc.getPlacePredictions({ input: q, sessionToken: _plannerToken(), language: 'en' }, (predictions, status) => {
      if (!isCurrentQuery()) return;
      if (status !== google.maps.places.PlacesServiceStatus.OK || !predictions) { hidePlanSuggestions(); return; }
      const items = predictions.slice(0, 8).map(p => ({
        place_id: p.place_id,
        name: p.structured_formatting.main_text,
        sub: p.structured_formatting.secondary_text || '',
        lat: null, lng: null
      }));
      showPlanSuggestions(items);
    });
  });
}

function showPlanSuggestions(items) {
  _planSuggestIdx = -1;
  const list = document.getElementById('planSuggest');
  if (!list) return;
  list.innerHTML = items.map(item =>
    '<div class="suggest-item" data-name="' + esc(item.name) + '" data-lat="' + (item.lat == null ? '' : item.lat) + '" data-lng="' + (item.lng == null ? '' : item.lng) + '" data-place-id="' + (item.place_id || '') + '" onclick="selectPlanSuggestion(this)">' +
    '<div class="si-name">' + esc(item.name) + '</div>' +
    (item.sub ? '<div class="si-sub">' + esc(item.sub) + '</div>' : '') +
    '</div>'
  ).join('');
  list.style.display = 'block';
}

function hidePlanSuggestions() {
  _planSuggestIdx = -1;
  const list = document.getElementById('planSuggest');
  if (list) list.style.display = 'none';
}

function selectPlanSuggestion(el) {
  const name = el.getAttribute('data-name');
  const latRaw = el.getAttribute('data-lat');
  const lngRaw = el.getAttribute('data-lng');
  const lat  = latRaw !== '' && isFinite(Number(latRaw)) ? Number(latRaw) : null;
  const lng  = lngRaw !== '' && isFinite(Number(lngRaw)) ? Number(lngRaw) : null;
  const placeId = el.getAttribute('data-place-id');
  document.getElementById('planName').value = name;
  hidePlanSuggestions();
  const _focusSave = () => { const btn = document.getElementById('planSaveBtn'); if (btn) btn.focus(); };
  if (lat !== null && lng !== null) {
    S.planGpsCoords = { lat, lng };
    S.planGpsSource = 'nominatim';
    setPlanGpsStatus('ok', 'Auto: ' + lat.toFixed(5) + ', ' + lng.toFixed(5));
    _focusSave();
  } else if (placeId && window.google) {
    setPlanGpsStatus('spin', 'Getting location...');
    _getPlacesService().getDetails({ placeId, fields: ['geometry'], sessionToken: _plannerToken() }, (place, status) => {
      _plannerAcToken = null;
      if (status === 'OK' && place.geometry) {
        const loc = place.geometry.location;
        S.planGpsCoords = { lat: loc.lat(), lng: loc.lng() };
        S.planGpsSource = 'nominatim';
        setPlanGpsStatus('ok', 'Auto: ' + S.planGpsCoords.lat.toFixed(5) + ', ' + S.planGpsCoords.lng.toFixed(5));
      } else { setPlanGpsStatus('err', 'Could not get location — tap Location to pick'); }
      _focusSave();
    });
  } else {
    _focusSave();
  }
}

var _planTypeKeys = [];
var _planTypeKbIdx = -1;

function _selectPlanType(key) {
  const t = LOCATION_TYPES[key];
  document.getElementById('planType').value = key || '';
  document.getElementById('planTypeInput').value = t ? (t.icon + ' ' + t.label) : '';
  const list = document.getElementById('planTypeList');
  if (list) list.style.display = 'none';
  _planTypeKbIdx = -1;
}

function _openPlanTypeList() {
  _planTypeKbIdx = -1;
  const list = document.getElementById('planTypeList');
  if (!list) return;
  list.innerHTML = _planTypeKeys.map(k => {
    const t = LOCATION_TYPES[k];
    return '<div class="suggest-item" data-key="' + k + '" onclick="_selectPlanType(\'' + k + '\')" style="font-size:12px;padding:7px 11px">' +
      '<span style="margin-right:5px">' + t.icon + '</span>' +
      '<span class="si-name">' + esc(t.label) + '</span></div>';
  }).join('');
  list.style.display = 'block';
}

function _filterPlanTypeList(val) {
  _planTypeKbIdx = -1;
  const list = document.getElementById('planTypeList');
  if (!list) return;
  const raw = (val || '').trim();
  const q = raw.replace(/^[^\w]+\s*/, '').toLowerCase();
  const matches = _planTypeKeys.filter(k => {
    if (!raw) return true;
    const pt = LOCATION_TYPES[k];
    return pt.label.toLowerCase().includes(q) || (pt.search && pt.search.toLowerCase().includes(q));
  });
  if (!matches.length) { list.style.display = 'none'; return; }
  list.innerHTML = matches.map(k => {
    const t = LOCATION_TYPES[k];
    return '<div class="suggest-item" data-key="' + k + '" onclick="_selectPlanType(\'' + k + '\')" style="font-size:12px;padding:7px 11px">' +
      '<span style="margin-right:5px">' + t.icon + '</span>' +
      '<span class="si-name">' + esc(t.label) + '</span></div>';
  }).join('');
  list.style.display = 'block';
}

function _planTypeKeydown(e) {
  const list = document.getElementById('planTypeList');
  const open = list && list.style.display !== 'none';
  if (e.key === 'Escape') { e.stopPropagation(); if (list) list.style.display = 'none'; _planTypeKbIdx = -1; return; }
  if (e.key === 'ArrowDown' && !open) { e.preventDefault(); _openPlanTypeList(); return; }
  if (!open) return;
  const items = list.querySelectorAll('.suggest-item');
  if (!items.length) return;
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    items.forEach(el => el.classList.remove('active'));
    _planTypeKbIdx = Math.min(_planTypeKbIdx + 1, items.length - 1);
    if (_planTypeKbIdx >= 0) { items[_planTypeKbIdx].classList.add('active'); items[_planTypeKbIdx].scrollIntoView({ block: 'nearest' }); }
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    items.forEach(el => el.classList.remove('active'));
    _planTypeKbIdx = Math.max(_planTypeKbIdx - 1, 0);
    if (_planTypeKbIdx >= 0) { items[_planTypeKbIdx].classList.add('active'); items[_planTypeKbIdx].scrollIntoView({ block: 'nearest' }); }
  } else if (e.key === 'Enter' && _planTypeKbIdx >= 0) {
    e.preventDefault();
    const key = items[_planTypeKbIdx].getAttribute('data-key');
    if (key) _selectPlanType(key);
  }
}

// ---- Import modal (JSON / KML) ----

var _planImportData = null;

function showPlanImportModal() {
  _planImportData = null;
  const ta = document.getElementById('planImportText');
  const fi = document.getElementById('planImportFile');
  const prev = document.getElementById('planImportPreview');
  const btn = document.getElementById('planImportBtn');
  const hint = document.getElementById('planImportHint');
  const arrow = document.getElementById('planImportHintArrow');
  if (ta) ta.value = '';
  if (fi) fi.value = '';
  if (prev) prev.innerHTML = '';
  if (btn) { btn.disabled = true; btn.style.opacity = '0.5'; btn.textContent = 'Import'; }
  if (hint) hint.style.display = 'none';
  if (arrow) arrow.textContent = '▼';
  document.getElementById('planImportModal').style.display = 'flex';
}

function closePlanImportModal() {
  document.getElementById('planImportModal').style.display = 'none';
}

function _onPlanImportFile(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const text = e.target.result || '';
    document.getElementById('planImportText').value = text;
    _onPlanImportInput(text);
  };
  reader.readAsText(file, 'UTF-8');
}

function _onPlanImportInput(text) {
  text = (text || '').trim();
  const prev = document.getElementById('planImportPreview');
  const btn  = document.getElementById('planImportBtn');
  _planImportData = null;

  if (!text) {
    prev.innerHTML = '';
    btn.disabled = true; btn.style.opacity = '0.5'; btn.textContent = 'Import';
    return;
  }

  let places = null;
  const isXml = text.startsWith('<?xml') || text.includes('<kml') || text.includes('<Placemark');
  if (isXml) {
    places = _parseKmlToPlaces(text);
  } else {
    places = _parsePlanJson(text);
  }

  if (!places || !places.length) {
    prev.innerHTML = '<div style="color:var(--danger);font-size:12px">⚠ Could not parse — expected a JSON array of places or a KML file.</div>';
    btn.disabled = true; btn.style.opacity = '0.5'; btn.textContent = 'Import';
    return;
  }

  const withCoords = places.filter(p => p.lat != null && p.lng != null).length;
  const names5 = places.slice(0, 5).map(p => esc(p.name)).join(', ');
  prev.innerHTML =
    '<div style="color:var(--success);font-size:12px;font-weight:600">✓ Found ' + places.length + ' place' + (places.length !== 1 ? 's' : '') +
    (withCoords < places.length ? ' <span style="font-weight:400;color:var(--muted)">(' + withCoords + ' with GPS)</span>' : '') + '</div>' +
    '<div style="font-size:11px;color:var(--muted);margin-top:3px">' + names5 + (places.length > 5 ? ', …' : '') + '</div>';

  _planImportData = places;
  btn.disabled = false; btn.style.opacity = '1';
  btn.textContent = 'Import ' + places.length + ' Place' + (places.length !== 1 ? 's' : '');
}

function _parsePlanJson(text) {
  let data;
  try { data = JSON.parse(text); } catch(e) { return null; }
  const arr = Array.isArray(data) ? data : (data && Array.isArray(data.places) ? data.places : null);
  if (!arr) return null;
  return arr.filter(p => p && p.name).map(p => ({
    name: String(p.name).trim(),
    type: LOCATION_TYPES[p.type] ? p.type : 'place',
    lat:  p.lat  != null ? parseFloat(p.lat)  : null,
    lng:  p.lng  != null ? parseFloat(p.lng)  : null,
    description: String(p.description || '').trim()
  })).filter(p => p.name);
}

function _parseKmlToPlaces(text) {
  let doc;
  try { doc = new DOMParser().parseFromString(text, 'text/xml'); } catch(e) { return null; }
  if (doc.querySelector('parsererror')) return null;
  const placemarks = Array.from(doc.querySelectorAll('Placemark'));
  if (!placemarks.length) return null;
  return placemarks.map(pm => {
    const name = ((pm.querySelector('name') || {}).textContent || '').trim();
    const rawDesc = ((pm.querySelector('description') || {}).textContent || '').trim();
    const description = rawDesc.replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim();
    const coordsEl = pm.querySelector('Point coordinates');
    let lat = null, lng = null;
    if (coordsEl) {
      const parts = coordsEl.textContent.trim().split(/[\s,]+/);
      if (parts.length >= 2) { lng = parseFloat(parts[0]); lat = parseFloat(parts[1]); }
    }
    return { name, description, type: 'place',
             lat: (isNaN(lat) ? null : lat), lng: (isNaN(lng) ? null : lng) };
  }).filter(p => p.name);
}

function _getImportPromptTemplate() {
  const types = Object.keys(LOCATION_TYPES).join(', ');
  return (
    'Convert the content below into Trip Planner import JSON.\n' +
    'Output ONLY a valid JSON array — no markdown fences, no explanation.\n\n' +
    'Format:\n' +
    '[\n' +
    '  {\n' +
    '    "name": "Schönbrunn Palace",\n' +
    '    "type": "fortress",\n' +
    '    "lat": 48.1845,\n' +
    '    "lng": 16.3122,\n' +
    '    "description": "optional notes or website URL"\n' +
    '  },\n' +
    '  { "name": "Café Central", "type": "coffee" }\n' +
    ']\n\n' +
    'Valid types (use the closest match):\n' +
    types + '\n\n' +
    'lat/lng and description are optional — omit if unknown.\n\n' +
    'Content to convert:\n' +
    '[PASTE YOUR LIST, URL, OR DESCRIPTION HERE]'
  );
}

function _toggleImportHint() {
  const hint = document.getElementById('planImportHint');
  const arrow = document.getElementById('planImportHintArrow');
  const pre = document.getElementById('planImportPromptText');
  if (!hint) return;
  const opening = hint.style.display === 'none';
  hint.style.display = opening ? 'block' : 'none';
  if (arrow) arrow.textContent = opening ? '▲' : '▼';
  if (opening && pre && !pre.textContent) pre.textContent = _getImportPromptTemplate();
}

function _copyImportPrompt() {
  const pre = document.getElementById('planImportPromptText');
  const btn = document.getElementById('planImportCopyBtn');
  if (!btn) return;
  const text = (pre && pre.textContent) || _getImportPromptTemplate();
  const done = () => { btn.textContent = '✓ Copied!'; setTimeout(() => { btn.textContent = 'Copy'; }, 2000); };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done).catch(() => _copyFallback(text, done));
  } else {
    _copyFallback(text, done);
  }
}

function _copyFallback(text, cb) {
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.cssText = 'position:fixed;opacity:0;top:0;left:0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); } catch(e) {}
  document.body.removeChild(ta);
  if (cb) cb();
}

function executePlanImport() {
  if (!_planImportData || !_planImportData.length) return;
  const btn = document.getElementById('planImportBtn');
  btn.disabled = true; btn.textContent = 'Importing…';
  google.script.run
    .withSuccessHandler(result => {
      closePlanImportModal();
      loadPlan();
      toast('Imported ' + result.added + ' place' + (result.added !== 1 ? 's' : '') + '!', 'ok');
    })
    .withFailureHandler(err => {
      btn.disabled = false; btn.style.opacity = '1';
      btn.textContent = 'Import ' + _planImportData.length + ' Places';
      toast('Import failed: ' + err.message, 'err');
    })
    .bulkImportPlanPlaces(S.currentTrip.id, JSON.stringify(_planImportData));
}

// Close pin/place menu when clicking anywhere outside it
document.addEventListener('click', function(e) {
  const menu = document.getElementById('plannerContextMenu');
  if (menu && menu.style.display !== 'none' && !menu.contains(e.target)) {
    const justOpened = Date.now() - _markerClickTime < 300 ||
                        Date.now() - _markerRCTime   < 300 ||
                        Date.now() - _lpTime         < 800;
    if (!justOpened) _hideContextMenu();
  }
  // Clear pin/chip highlight when clicking outside the chip and outside the map
  // (the map itself clears/sets highlight via its own click/marker listeners).
  // Also excludes the Pin Menu itself — e.g. its "Locate on Map" action sets a fresh
  // highlight synchronously, and that same click event bubbles here right after;
  // without this exclusion it would immediately clear the highlight it just set.
  if (S._highlightedPlaceId && e.target.closest &&
      !e.target.closest('.plan-bank-bar-chip') && !e.target.closest('#planner-map') &&
      !e.target.closest('#plannerContextMenu')) {
    _clearPlaceHighlight();
  }
});
