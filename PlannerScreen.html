<!-- VIEW: PLANNER -->
<div class="view" id="view-planner">
  <div class="tracker-tabs">
    <button class="tracker-tab on" id="tab-plan-map" onclick="switchPlannerTab('map')">🗺 Places</button>
    <button class="tracker-tab"   id="tab-plan-cal" onclick="switchPlannerTab('cal')">📅 Calendar</button>
  </div>

  <!-- Map panel (default) -->
  <div id="panel-plan-map">
    <!-- Bank chips bar -->
    <div id="planBankBar" style="display:none">
      <div style="display:flex;align-items:center;justify-content:flex-start;gap:8px;padding:6px 0 4px">
        <span style="font-size:11px;font-weight:800;letter-spacing:0.5px;color:var(--muted);text-transform:uppercase">Bank</span>
        <button onclick="togglePlanBankBar()" style="background:none;border:none;font-size:13px;color:var(--muted);cursor:pointer;padding:2px 0;font-weight:600">▲ Hide</button>
        <button id="planSelectModeBtn" onclick="togglePlanSelectMode()" style="background:none;border:none;font-size:13px;color:var(--muted);cursor:pointer;padding:2px 0;font-weight:600;margin-left:auto">☑️ Select</button>
      </div>
      <div id="planBankBarChips" style="display:flex;flex-wrap:wrap;gap:6px;padding-bottom:8px"></div>
      <div id="planSelectBar" style="display:none;align-items:center;justify-content:space-between;gap:8px;padding:2px 0 8px"></div>
    </div>
    <div id="planBankBarCollapsed" style="display:none;padding:2px 0 8px">
      <button id="planBankBarShowBtn" onclick="togglePlanBankBar()" style="background:none;border:1.5px solid var(--border);border-radius:8px;font-size:13px;color:var(--muted);cursor:pointer;padding:4px 12px;font-weight:600">▼ Bank</button>
    </div>
    <!-- Import button + Map -->
    <div style="display:flex;justify-content:flex-end;padding:2px 0 5px">
      <button onclick="showPlanImportModal()" style="background:var(--card);border:1.5px solid var(--border);border-radius:8px;font-size:12px;padding:5px 11px;cursor:pointer;color:var(--muted);font-weight:600">📥 Import</button>
    </div>
    <div style="position:relative;border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);margin-bottom:14px">
      <div id="planner-map"></div>
      <button type="button" class="map-location-btn" aria-label="Focus map on my location" title="My location" onclick="focusPlannerMapOnMyLocation(this)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8Zm0-6v3m0 14v3M2 12h3m14 0h3"/><circle cx="12" cy="12" r="9"/></svg>
      </button>
    </div>
    <div style="height:30px"></div> 
  </div>

  <!-- Calendar panel -->
  <div id="panel-plan-cal" style="display:none">
    <div id="planCalContent" style="background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:10px 8px;margin-bottom:14px"></div>
    <div style="height:30px"></div>
  </div>
</div>

<!-- Planner Import Modal -->
<div id="planImportModal" style="display:none;position:fixed;inset:0;z-index:350;background:rgba(0,0,0,0.45);align-items:flex-start;justify-content:center;padding:70px 16px 16px;overflow-y:auto">
  <div style="background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);width:100%;max-width:440px">
    <div style="padding:16px 16px 8px;display:flex;align-items:center;justify-content:space-between">
      <div style="font-weight:700;font-size:15px;color:var(--text)">📥 Import Places</div>
      <button onclick="closePlanImportModal()" style="background:none;border:none;font-size:22px;cursor:pointer;color:var(--muted);padding:4px;line-height:1">×</button>
    </div>
    <div style="padding:0 16px 8px;font-size:12px;color:var(--muted)">Upload a <strong>JSON</strong> file or paste <strong>KML</strong> exported from Google My Maps.</div>

    <!-- Claude prompt template hint -->
    <div style="padding:0 16px 10px">
      <button onclick="_toggleImportHint()" id="planImportHintBtn" style="background:none;border:none;font-size:12px;color:var(--primary);cursor:pointer;padding:0;font-weight:600;display:flex;align-items:center;gap:4px">
        💡 Claude prompt template <span id="planImportHintArrow" style="font-size:10px">▼</span>
      </button>
      <div id="planImportHint" style="display:none;margin-top:8px;background:#F8FAFC;border:1px solid var(--border);border-radius:8px;overflow:hidden">
        <div style="padding:5px 10px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);background:#EEF2F7">
          <span style="font-size:11px;color:var(--muted)">Copy → give to Claude → paste result below</span>
          <button onclick="_copyImportPrompt()" id="planImportCopyBtn" style="background:var(--primary);color:#fff;border:none;border-radius:6px;font-size:11px;padding:3px 10px;cursor:pointer;font-weight:600">Copy</button>
        </div>
        <pre id="planImportPromptText" style="margin:0;padding:10px;font-size:10.5px;font-family:monospace;color:var(--text);white-space:pre-wrap;word-break:break-word;max-height:180px;overflow-y:auto;line-height:1.55"></pre>
      </div>
    </div>

    <div style="padding:0 16px 10px">
      <label style="display:flex;align-items:center;gap:10px;cursor:pointer;border:1.5px dashed var(--border);border-radius:10px;padding:10px 14px;font-size:13px;color:var(--muted);user-select:none">
        📎 Choose file (.json or .kml)
        <input type="file" id="planImportFile" accept=".json,.kml,.xml" onchange="_onPlanImportFile(this)" style="display:none">
      </label>
    </div>
    <div style="padding:0 16px 4px;text-align:center;font-size:11px;color:var(--muted)">— or paste below —</div>
    <div style="padding:4px 16px 10px">
      <textarea id="planImportText" placeholder="Paste JSON or KML text…" oninput="_onPlanImportInput(this.value)" style="width:100%;box-sizing:border-box;border:1.5px solid var(--border);border-radius:10px;padding:10px;font-size:12px;height:100px;font-family:monospace;resize:vertical;color:var(--text);outline:none"></textarea>
    </div>
    <div id="planImportPreview" style="padding:0 16px 8px;min-height:20px"></div>
    <div style="padding:0 16px 16px;display:flex;gap:8px;justify-content:flex-end">
      <button class="btn btn-outline btn-sm" onclick="closePlanImportModal()">Cancel</button>
      <button id="planImportBtn" class="btn btn-primary btn-sm" onclick="executePlanImport()" disabled style="opacity:0.5;min-width:100px">Import</button>
    </div>
  </div>
</div>

<script>
// =======================================================
// PLANNER
// =======================================================

var _planSuggestIdx = -1;
var _planDupeConfirmed = false;

function _linkifyDesc(text) {
  const parts = text.split(/(https?:\/\/[^\s]+)/);
  return parts.map(function(part, i) {
    if (i % 2 === 1) {
      return '<a href="' + part.replace(/"/g, '%22') + '" target="_blank" rel="noopener" style="color:#1565C0;word-break:break-all">' + esc(part) + '</a>';
    }
    return esc(part);
  }).join('');
}

function _googleTypeToPlanner(types) {
  const rules = [
    [['lodging'],                                                            'hotel'],
    [['restaurant','food','meal_takeaway','meal_delivery'],                  'restaurant'],
    [['cafe'],                                                               'coffee'],
    [['bakery','confectionery'],                                             'sweet'],
    [['bar','night_club'],                                                   'beer'],
    [['supermarket','grocery_or_supermarket'],                               'supermarket'],
    [['shopping_mall','store','clothing_store','department_store'],          'shop'],
    [['gas_station'],                                                        'gas-station'],
    [['museum','art_gallery'],                                               'museum'],
    [['church','mosque','synagogue','place_of_worship','hindu_temple'],      'fortress'],
    [['airport'],                                                            'airport'],
    [['car_rental'],                                                         'car-rental'],
    [['parking'],                                                            'parking'],
    [['natural_feature','park','campground'],                                'nature-hike'],
    [['tourist_attraction','amusement_park','aquarium','zoo','stadium'],     'attraction'],
  ];
  for (const [gtypes, key] of rules) {
    if (types.some(t => gtypes.includes(t))) return key;
  }
  return 'place';
}

function onPlanNameKeydown(e) {
  const list = document.getElementById('planSuggest');
  const open = list && list.style.display !== 'none';
  if (!open) return;
  if (e.key === 'ArrowDown') { e.preventDefault(); _planSuggestIdx = _navigateSuggest('planSuggest', _planSuggestIdx, 1); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); _planSuggestIdx = _navigateSuggest('planSuggest', _planSuggestIdx, -1); }
  else if (e.key === 'Enter' && _planSuggestIdx >= 0) {
    e.preventDefault();
    const el = list.querySelectorAll('.suggest-item')[_planSuggestIdx];
    if (el) selectPlanSuggestion(el);
    _planSuggestIdx = -1;
  } else if (e.key === 'Escape') { e.stopPropagation(); hidePlanSuggestions(); _planSuggestIdx = -1; }
}

function loadPlan() {
  const el = document.getElementById('planBankList');
  if (el) el.innerHTML = '<div style="text-align:center;padding:32px;color:var(--muted)">Loading…</div>';
  google.script.run
    .withSuccessHandler(plan => {
      S.planBank        = (plan && plan.bank)        || [];
      S.planAssignments = (plan && plan.assignments) || {};
      S.planNotes       = (plan && plan.notes)       || {};
      S.planDrives      = (plan && plan.drives)      || {};
      S.planActivities  = (plan && plan.activities)  || {};
      S.planOrder       = (plan && plan.orders)      || {};
      // Attach photo to newly created place (matched by name)
      if (S._planPendingPhotoAssign) {
        const pa = S._planPendingPhotoAssign; S._planPendingPhotoAssign = null;
        if (!S._planPhotoCache) S._planPhotoCache = {};
        const found = S.planBank.find(p => p.name === pa.name && !(p.id in S._planPhotoCache));
        if (found) {
          if (pa.photoUrl) {
            S._planPhotoCache[found.id] = pa.photoUrl; // photo from context menu path
          }
          // else: photo will be fetched lazily when pin menu opens
        }
      }
      renderPlanBank();
      if (S.plannerTab === 'map') setTimeout(() => initPlannerMap(true), 50);
    })
    .withFailureHandler(err => {
      if (el) el.innerHTML = '<div style="color:var(--danger);padding:20px">Failed to load plan</div>';
    })
    .getPlan(S.currentTrip.id);
}

function _positionFormSheet() {
  const sheet = document.querySelector('#plan-form-wrap .plan-form-sheet');
  if (!sheet) return;
  const W = 298, H = 355;
  const vw = window.innerWidth, vh = window.innerHeight;
  const anchor = S._formAnchorXY || S._lastClickXY;
  S._formAnchorXY = null;
  let left, top;
  if (anchor) {
    left = anchor.x + 10;
    top  = anchor.y + 10;
    if (left + W > vw - 8) left = anchor.x - W - 10;
    if (top  + H > vh - 8) top  = anchor.y - H - 10;
    left = Math.max(8, Math.min(left, vw - W - 8));
    top  = Math.max(58, Math.min(top,  vh - H - 8));
  } else {
    left = Math.max(8, (vw - W) / 2);
    top  = Math.max(58, (vh - H) / 3);
  }
  sheet.style.left = left + 'px';
  sheet.style.top  = top  + 'px';
  sheet.style.transform = 'none';
}

function showPlannerForm(presetCoords, presetName, presetType, presetDesc) {
  _hideContextMenu();
  S.editingPlaceId = null;
  S.planGpsCoords = presetCoords || null;
  S.planGpsSource = presetCoords ? 'manual' : 'none';
  document.getElementById('planName').value = presetName || '';
  _selectPlanType(presetType || 'place');
  document.getElementById('planDesc').value = presetDesc || '';
  if (presetCoords) {
    setPlanGpsStatus('ok', 'Map pin: ' + presetCoords.lat.toFixed(5) + ', ' + presetCoords.lng.toFixed(5));
  } else {
    setPlanGpsStatus('spin', 'Acquiring GPS…');
    acquirePlanGPS();
  }
  document.getElementById('planSaveBtn').textContent = '+ Add to Bank';
  _positionFormSheet();
  document.getElementById('plan-form-wrap').style.display = 'block';
  var _sw = window.innerWidth - document.documentElement.clientWidth;
  document.body.style.overflow = 'hidden';
  document.body.style.paddingRight = (_sw > 0 ? _sw : 0) + 'px';
  S._suppressSuggestOnFocus = true;
  setTimeout(() => { const el = document.getElementById('planName'); if (el) el.focus(); }, 80);
}

function cancelPlannerForm() {
  S.editingPlaceId = null;
  S._ctxMenuPhotoUrl = null;
  _planDupeConfirmed = false;
  _hideDupeWarn();
  document.getElementById('plan-form-wrap').style.display = 'none';
  document.body.style.overflow = '';
  document.body.style.paddingRight = '';
  hidePlanSuggestions();
  const tl = document.getElementById('planTypeList');
  if (tl) tl.style.display = 'none';
}

function _findDuplicatePlanPlace(name, lat, lng) {
  if (!S.planBank || !name || lat == null || lng == null) return null;
  const norm = name.trim().toLowerCase();
  return S.planBank.find(p =>
    (p.name || '').trim().toLowerCase() === norm &&
    p.lat != null && p.lng != null &&
    Math.abs(parseFloat(p.lat) - lat) < 0.0002 &&
    Math.abs(parseFloat(p.lng) - lng) < 0.0002
  ) || null;
}

function _showDupeWarn() {
  const w = document.getElementById('planDupeWarn');
  if (w) w.style.display = 'block';
}

function _hideDupeWarn() {
  const w = document.getElementById('planDupeWarn');
  if (w) w.style.display = 'none';
}

function _saveAnyway() {
  _planDupeConfirmed = true;
  savePlanPlaceUI();
}

function acquirePlanGPS() {
  if (!navigator.geolocation) { setPlanGpsStatus('err', 'GPS not available'); return; }
  navigator.geolocation.getCurrentPosition(
    pos => {
      S.planGpsCoords = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      S.planGpsSource = 'gps';
      setPlanGpsStatus('ok', 'GPS: ' + S.planGpsCoords.lat.toFixed(5) + ', ' + S.planGpsCoords.lng.toFixed(5));
    },
    () => { setPlanGpsStatus('err', 'GPS unavailable — tap Location to pick'); },
    { enableHighAccuracy: true, timeout: 10000 }
  );
}

function setPlanGpsStatus(state, text) {
  const dot = document.getElementById('planGpsDot');
  const txt = document.getElementById('planGpsText');
  if (!dot || !txt) return;
  dot.className = 'gps-dot' + (state === 'ok' ? ' ok' : state === 'spin' ? ' spin-dot' : ' err');
  txt.textContent = text;
}

function renderPlanBank() {
  renderBankBarChips();
}

function renderBankBarChips() {
  const bar      = document.getElementById('planBankBarChips');
  const bankBar  = document.getElementById('planBankBar');
  const collapsed = document.getElementById('planBankBarCollapsed');
  if (!bar) return;
  const hasPlaces = S.planBank && S.planBank.length > 0;
  if (!hasPlaces) {
    if (bankBar)  bankBar.style.display  = 'none';
    if (collapsed) collapsed.style.display = 'none';
    return;
  }
  const isVisible = S._bankBarVisible !== false;
  if (bankBar)  bankBar.style.display  = isVisible ? 'block' : 'none';
  if (collapsed) {
    collapsed.style.display = isVisible ? 'none' : 'block';
    const btn = document.getElementById('planBankBarShowBtn');
    if (btn) btn.textContent = '▼ Bank (' + S.planBank.length + ')';
  }
  if (!isVisible) return;
  const hl = S._highlightedPlaceId;
  const selMode = !!S._planSelectMode;
  const selected = S._planSelectedIds || [];
  bar.innerHTML = S.planBank.map(p => {
    const t = LOCATION_TYPES[p.type] || { icon: '📌', color: '#9E9E9E' };
    const isHL = p.id === hl;
    const isMk = !!p.marked;
    const isSel = selMode && selected.indexOf(p.id) !== -1;
    const border = isSel ? '2px solid var(--primary)' : (isHL ? '2px solid ' + t.color : (isMk ? '2px solid #FFE0B0' : '1.5px solid ' + t.color));
    const bg    = isSel ? '#E3F2FD' : (isMk ? '#FFF3E0' : '#fff');
    return '<span id="bankbar-' + p.id + '" class="plan-bank-bar-chip" onclick="bankBarChipClick(\'' + p.id + '\')" ' +
      (selMode ? '' : 'oncontextmenu="event.preventDefault();event.stopPropagation();bankBarChipRightClick(\'' + p.id + '\',event)" ') +
      'title="' + esc(p.name) + '" ' +
      'style="background:' + bg + ';color:#222;border:' + border + '">' +
      (selMode ? '<span style="font-size:12px;line-height:1">' + (isSel ? '☑️' : '⬜') + '</span>' : (isMk ? '<span style="font-size:10px;line-height:1">⭐</span>' : '')) +
      '<span>' + t.icon + '</span>' +
      '<span style="max-width:140px;overflow:hidden;text-overflow:ellipsis">' + esc(p.name) + '</span>' +
      (selMode ? '' : '<button class="plan-bank-chip-del" onclick="event.stopPropagation();confirmDeletePlanPlace(\'' + p.id + '\')">×</button>') +
      '</span>';
  }).join('');
  renderPlanSelectBar();
}

function renderPlanSelectBar() {
  const bar = document.getElementById('planSelectBar');
  if (!bar) return;
  if (!S._planSelectMode) { bar.style.display = 'none'; return; }
  const n = (S._planSelectedIds || []).length;
  bar.style.display = 'flex';
  bar.innerHTML =
    '<span style="font-size:12px;font-weight:700;color:var(--text)">' + n + ' selected</span>' +
    '<div style="display:flex;gap:8px">' +
    '<button class="btn btn-outline btn-sm" style="padding:5px 12px;min-height:30px;font-size:12px" onclick="cancelPlanSelectMode()">Cancel</button>' +
    '<button class="btn btn-primary btn-sm" style="padding:5px 12px;min-height:30px;font-size:12px"' + (n ? '' : ' disabled') + ' onclick="openDayPickerForPlaces()">📅 Assign to Day</button>' +
    '</div>';
}

// Jumps to the Planner Map tab (if not already there) and highlights + centers the
// given place's pin. Used by the Pin Menu's "Locate on Map" action, reachable from
// the Calendar tab's place pills as well as the Bank chips and the map itself.
function locatePlaceOnMap(placeId) {
  _hideContextMenu();
  const p = S.planBank.find(x => x.id === placeId);
  if (!p) return;
  if (p.lat == null || p.lng == null) { toast('This place has no location set', 'err'); return; }
  if (S.plannerTab === 'map' && S.plannerMap) {
    _setPlaceHighlight(placeId);
    _centerMapOnPlace(placeId);
  } else {
    S._planPendingHighlight = placeId;
    switchPlannerTab('map');
  }
}

function togglePlanSelectMode() {
  S._planSelectMode = !S._planSelectMode;
  S._planSelectedIds = S._planSelectMode ? (S._planSelectedIds || []) : [];
  const btn = document.getElementById('planSelectModeBtn');
  if (btn) btn.textContent = S._planSelectMode ? '✕ Cancel' : '☑️ Select';
  if (S._planSelectMode) _clearPlaceHighlight();
  renderBankBarChips();
}

function cancelPlanSelectMode() {
  S._planSelectMode = false;
  S._planSelectedIds = [];
  const btn = document.getElementById('planSelectModeBtn');
  if (btn) btn.textContent = '☑️ Select';
  renderBankBarChips();
}

function togglePlanChipSelect(id) {
  S._planSelectedIds = S._planSelectedIds || [];
  const idx = S._planSelectedIds.indexOf(id);
  if (idx === -1) S._planSelectedIds.push(id);
  else S._planSelectedIds.splice(idx, 1);
  renderBankBarChips();
}

// Shared grid-builder for the assign-by-day calendar modals (single-place toggle
// picker and bulk multi-select picker below). dayCellHtml(ds) returns the HTML for
// one in-range day cell; out-of-range cells are rendered uniformly by this helper.
function _buildTripCalendarGrid(start, end, dayCellHtml) {
  const tripSet = new Set();
  const byMonth = {};
  const cur = new Date(start + 'T12:00:00Z');
  const last = new Date(end   + 'T12:00:00Z');
  while (cur <= last) {
    const ds = cur.toISOString().slice(0, 10);
    const ym = ds.slice(0, 7);
    tripSet.add(ds);
    if (!byMonth[ym]) byMonth[ym] = [];
    byMonth[ym].push(ds);
    cur.setUTCDate(cur.getUTCDate() + 1);
  }

  const DOW = ['Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa', 'Su'];
  let html = '';
  Object.keys(byMonth).sort().forEach(ym => {
    const [yr, mo] = ym.split('-').map(Number);
    const mLabel = new Date(Date.UTC(yr, mo - 1, 1)).toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
    html += '<div style="margin-bottom:14px">';
    html += '<div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:5px">' + mLabel + '</div>';
    html += '<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px">';
    DOW.forEach(d => { html += '<div style="font-size:10px;color:var(--muted);font-weight:600;text-align:center;padding:1px 0">' + d + '</div>'; });

    const firstDow = new Date(Date.UTC(yr, mo - 1, 1)).getUTCDay();
    const offset = (firstDow + 6) % 7; // Mon=0
    for (let i = 0; i < offset; i++) html += '<div></div>';

    const daysInMonth = new Date(Date.UTC(yr, mo, 0)).getUTCDate();
    for (let d = 1; d <= daysInMonth; d++) {
      const ds = ym + '-' + String(d).padStart(2, '0');
      html += tripSet.has(ds)
        ? dayCellHtml(ds)
        : '<div style="font-size:11px;color:#D1D5DB;text-align:center;padding:5px 2px;border-radius:5px">' + d + '</div>';
    }
    html += '</div></div>';
  });
  return html;
}

// Bulk day-picker for the current multi-select — tapping a day assigns every
// selected place to it in one action (merging with whatever's already assigned
// that day, not replacing it).
function openDayPickerForPlaces() {
  const ids = (S._planSelectedIds || []).slice();
  if (!ids.length) return;
  if (S._planInfoWindow) S._planInfoWindow.close();

  const range = _planDateRange();
  if (!range) { toast('Set trip dates or assign a place to a day first', 'err'); return; }

  let html = '<div style="font-size:12px;color:var(--muted);margin-bottom:10px">Assign <strong>' +
    ids.length + ' place' + (ids.length !== 1 ? 's' : '') + '</strong> to a day:</div>';
  html += '<div style="max-height:58vh;overflow-y:auto;padding-right:2px">';
  html += _buildTripCalendarGrid(range.first, range.last, ds =>
    '<div onclick="_assignSelectedToDay(\'' + ds + '\')" ' +
    'style="font-size:11px;text-align:center;padding:5px 2px;border-radius:5px;cursor:pointer;user-select:none;background:transparent;border:1.5px solid var(--border);color:var(--text);font-weight:400">' +
    parseInt(ds.slice(-2), 10) + '</div>'
  );
  html += '</div>';

  showModal('📅 Assign to Day', html);
}

function _assignSelectedToDay(dateStr) {
  const ids = (S._planSelectedIds || []).slice();
  closeModal();
  if (!ids.length) return;
  const cur = new Set(S.planAssignments[dateStr] || []);
  ids.forEach(id => cur.add(id));
  S.planAssignments[dateStr] = Array.from(cur);
  cancelPlanSelectMode();
  if (S.plannerTab === 'cal') buildPlannerCalendar();
  toast(ids.length + ' place' + (ids.length !== 1 ? 's' : '') + ' assigned', 'ok');
  google.script.run
    .withFailureHandler(err => { toast('Sync error: ' + err.message, 'err'); loadPlan(); })
    .addPlacesToDay(S.currentTrip.id, dateStr, ids);
}

function togglePlanBankBar() {
  S._bankBarVisible = (S._bankBarVisible === false) ? true : false;
  renderBankBarChips();
}

function bankBarChipClick(id) {
  if (S._planSelectMode) { togglePlanChipSelect(id); return; }
  closeModal();
  _hideContextMenu();
  _setPlaceHighlight(id);
  const chip = document.getElementById('bankbar-' + id);
  if (chip) chip.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'nearest' });
  _centerMapOnPlace(id);
}

function bankBarChipRightClick(id, evt) {
  _setPlaceHighlight(id);
  showPinMenu(id, evt.clientX, evt.clientY);
}

// Centers the map on a place's marker, targeting the middle of the map's *on-screen*
// visible slice — not just the middle of the whole map container. The map div can be
// taller than the browser viewport (e.g. with the bank bar open, part of the map may
// be scrolled off the top or bottom of the page), so centering within the full
// container isn't enough; this also accounts for the bank bar covering the top edge
// of whatever part of the map is actually on-screen.
function _centerMapOnPlace(id) {
  const marker = (S.plannerMarkers || []).find(m => m._placeId === id);
  const container = document.getElementById('planner-map');
  if (!marker || !S.plannerMap || !container) return;
  S.plannerMap.setCenter(marker.getPosition());

  const rect = container.getBoundingClientRect();
  const viewTop = Math.max(rect.top, 0);
  const viewBottom = Math.min(rect.bottom, window.innerHeight);
  let dy = 0;
  if (viewBottom > viewTop) {
    const visibleCenterY   = (viewTop + viewBottom) / 2;
    const containerCenterY = rect.top + rect.height / 2;
    dy = containerCenterY - visibleCenterY; // panBy(0, dy) shifts marker's on-screen Y by -dy
  }
  const bar = document.getElementById('planBankBar');
  if (bar && bar.offsetHeight) dy -= Math.round(bar.offsetHeight / 2 + 30);
  if (dy) S.plannerMap.panBy(0, dy);
}

// Builds the marker icon for a bank place. `highlighted` swaps the pin for a solid,
// high-contrast marker, modestly larger than a regular pin, so it's unmistakable in
// a dense cluster — normal/marked appearance otherwise. Uses the same fixed-pixel
// SymbolPath scale mechanism as regular pins, so it resizes on zoom exactly like
// every other pin (no independent/zoom-relative sizing logic needed).
function _planMarkerIcon(p, highlighted) {
  const t = LOCATION_TYPES[p.type] || { icon: '📌', color: '#9E9E9E' };
  const isMk = !!p.marked;
  if (highlighted) {
    return {
      path: google.maps.SymbolPath.CIRCLE,
      fillColor: '#FF1744', fillOpacity: 1,
      strokeColor: '#ffffff', strokeWeight: 3,
      scale: 18
    };
  }
  return {
    path: google.maps.SymbolPath.CIRCLE,
    fillColor: isMk ? '#FFE0B0' : '#ffffff',
    fillOpacity: 1,
    strokeColor: t.color,
    strokeWeight: isMk ? 3 : 2,
    scale: 14
  };
}

function _updateMarkerIcon(placeId) {
  const p = (S.planBank || []).find(x => x.id === placeId);
  const marker = (S.plannerMarkers || []).find(m => m._placeId === placeId);
  if (!p || !marker) return;
  const highlighted = placeId === S._highlightedPlaceId;
  marker.setIcon(_planMarkerIcon(p, highlighted));
  const t = LOCATION_TYPES[p.type] || { icon: '📌' };
  marker.setLabel({ text: t.icon, color: highlighted ? '#fff' : '#222', fontSize: highlighted ? '16px' : '13px' });
  marker.setZIndex(highlighted ? 9999 : null);
}

// Highlights a bank place's chip + pin. Reverts the previously highlighted pin's icon.
function _setPlaceHighlight(id) {
  const prev = S._highlightedPlaceId;
  S._highlightedPlaceId = id;
  if (prev && prev !== id) _updateMarkerIcon(prev);
  _updateMarkerIcon(id);
  renderBankBarChips();
}

// Clears any highlighted bank place's chip + pin back to their default look.
function _clearPlaceHighlight() {
  const prev = S._highlightedPlaceId;
  if (!prev) return;
  S._highlightedPlaceId = null;
  _updateMarkerIcon(prev);
  renderBankBarChips();
}

// Builds and shows the Pin Menu for a saved place at viewport coords (cx, cy).
// Called from marker rightclick and chip rightclick.
function showPinMenu(placeId, cx, cy) {
  const p = (S.planBank || []).find(x => x.id === placeId);
  if (!p) return;
  const menu = document.getElementById('plannerContextMenu');
  if (!menu) return;
  menu._pinId = placeId; // used by async photo update
  menu._anchorLat = hasGpsCoords(p) ? parseFloat(p.lat) : null;
  menu._anchorLng = hasGpsCoords(p) ? parseFloat(p.lng) : null;
  const vw = window.innerWidth, menuW = 260;
  menu.style.left = (vw - cx - 8 >= menuW ? cx + 4 : Math.max(8, cx - menuW - 4)) + 'px';
  menu.style.top  = Math.min(cy, window.innerHeight - 280) + 'px';
  const bt = LOCATION_TYPES[p.type] || { icon: '📌', label: 'Place', color: '#9E9E9E' };
  const curAsgn = Object.keys(S.planAssignments || {})
    .filter(ds => (S.planAssignments[ds] || []).indexOf(placeId) !== -1).sort();
  const shownA = curAsgn.slice(0, 4), restA = curAsgn.length - shownA.length;
  const asgnHtml = curAsgn.length
    ? '<div style="font-size:11px;color:#166534;background:#DCFCE7;border-radius:5px;padding:3px 8px;margin:0 14px 8px;line-height:1.8">📅 ' +
      shownA.map(ds => new Date(ds + 'T12:00:00Z').toLocaleDateString('en-US', { month: 'short', day: 'numeric' })).join(' · ') +
      (restA ? ' <span style="opacity:.7">+' + restA + ' more</span>' : '') + '</div>'
    : '<div style="font-size:11px;color:var(--muted);padding:0 14px 8px">Not assigned to any day yet</div>';
  const descHtml = p.description
    ? '<div style="font-size:11px;color:#374151;padding:0 14px 6px;line-height:1.5;word-break:break-word;max-height:56px;overflow:hidden">' +
      _linkifyDesc(p.description.length > 100 ? p.description.substring(0, 100) + '…' : p.description) + '</div>'
    : '';
  const _hasCoords = hasGpsCoords(p);
  const bLat = _hasCoords ? parseFloat(p.lat) : 0;
  const bLng = _hasCoords ? parseFloat(p.lng) : 0;
  // Search by name (falling back to coords only if unnamed) so the link lands on the
  // actual named place instead of an unlabeled point near it. Appending the coords as
  // extra query text helps Google disambiguate when the name alone is generic.
  const gmUrl = p.name
    ? 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(p.name + (_hasCoords ? ' ' + bLat + ',' + bLng : ''))
    : 'https://www.google.com/maps/search/?api=1&query=' + bLat + ',' + bLng;
  const _isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  const wazeUrl = 'waze://?ll=' + bLat + ',' + bLng + '&navigate=yes';
  const bs = 'flex:1;padding:7px 4px;background:none;border:none;cursor:pointer;font-size:11px;font-weight:600;text-align:center';
  const pid = placeId;

  // Photo: undefined = not yet fetched, null = no photo, string = url
  const cachedPhoto = (S._planPhotoCache || {})[placeId];
  const photoHtml = cachedPhoto
    ? '<div id="pin-photo-wrap" style="height:80px;overflow:hidden;background:#e5e7eb"><img src="' + esc(cachedPhoto) + '" style="width:100%;height:100%;object-fit:cover" loading="lazy" onerror="this.parentNode.style.display=\'none\'"></div>'
    : '<div id="pin-photo-wrap" style="display:none;height:80px;overflow:hidden;background:#e5e7eb"></div>';

  menu.innerHTML =
    photoHtml +
    '<button onclick="_hideContextMenu()" style="position:absolute;top:0;right:0;background:none;border:none;font-size:22px;line-height:1;cursor:pointer;color:var(--muted);z-index:1;padding:10px 12px;min-width:44px;min-height:44px;display:flex;align-items:center;justify-content:center">×</button>' +
    '<div style="padding:10px 14px 2px;padding-right:40px;font-weight:700;font-size:13px;color:var(--text)">' + esc(p.name) + '</div>' +
    '<div style="font-size:11px;color:var(--text);padding:0 14px 4px">' + bt.icon + ' ' + esc(bt.label) + '</div>' +
    descHtml + asgnHtml +
    '<div style="border-top:1px solid var(--border);padding:2px 6px;display:flex">' +
    '<button onclick="_hideContextMenu();openDayPickerForPlace(\'' + pid + '\')" style="' + bs + ';color:var(--text)">📅 Assign</button>' +
    '<button onclick="_hideContextMenu();editPlanPlace(\'' + pid + '\')" style="' + bs + ';color:var(--text)">✏️ Edit</button>' +
    '<button id="pinMarkBtn" onclick="togglePlanPlaceMark(\'' + pid + '\')" style="' + bs + ';color:' + (p.marked ? '#FFE0B0' : 'var(--text)') + '">' + (p.marked ? '⭐ Marked' : '☆ Mark') + '</button>' +
    '<button onclick="ctxMenuDelete(\'' + pid + '\',event)" style="' + bs + ';color:#EF4444">✕ Del</button>' +
    '</div>' +
    (_hasCoords ? '<button onclick="_hideContextMenu();locatePlaceOnMap(\'' + pid + '\')" style="display:block;width:100%;text-align:left;background:none;border:none;cursor:pointer;padding:7px 14px;font-size:12px;color:var(--primary);font-weight:600;border-top:1px solid var(--border)">📍 Locate on Map</button>' : '') +
    '<a href="' + esc(gmUrl) + '" target="_blank" rel="noopener" style="display:block;padding:7px 14px;font-size:12px;color:var(--muted);text-decoration:none;border-top:1px solid var(--border)">🗺️ View on Google Maps</a>' +
    (_isMobile && _hasCoords ? '<a href="' + wazeUrl + '" style="display:flex;align-items:center;gap:6px;padding:7px 14px;font-size:12px;color:#00b4d8;text-decoration:none;border-top:1px solid var(--border)"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="14" height="14" style="flex-shrink:0"><rect width="32" height="32" rx="8" fill="#33CCFF"/><circle cx="11" cy="13" r="3" fill="white"/><circle cx="21" cy="13" r="3" fill="white"/><path d="M10 20 Q16 24 22 20" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg>Navigate with Waze</a>' : '');
  menu.style.display = 'block';

  // Post-render: clamp so menu stays in viewport
  setTimeout(() => {
    const rect = menu.getBoundingClientRect();
    if (rect.bottom > window.innerHeight - 4)
      menu.style.top = Math.max(4, window.innerHeight - rect.height - 4) + 'px';
  }, 0);

  // Lazy-fetch photo if not yet attempted
  if (cachedPhoto === undefined && p.name) {
    if (!S._planPhotoCache) S._planPhotoCache = {};
    S._planPhotoCache[placeId] = null; // prevent re-fetch
    _fetchPinPhoto(placeId, p.name, p.lat, p.lng);
  }
}

// Async: search for a photo by place name+coords, cache it, update open pin menu if still visible.
function _fetchPinPhoto(bankPlaceId, name, lat, lng) {
  loadGoogleMaps(() => {
    const svc = _getPlacesService();
    if (!svc) return;
    const req = { query: name, fields: ['photos'] };
    const flat = parseFloat(lat), flng = parseFloat(lng);
    if (!isNaN(flat) && !isNaN(flng)) req.locationBias = { lat: flat, lng: flng };
    svc.findPlaceFromQuery(req, (results, status) => {
      let url = null;
      if (status === 'OK' && results && results[0] && (results[0].photos || []).length)
        url = results[0].photos[0].getUrl({ maxWidth: 640, maxHeight: 160 });
      if (!S._planPhotoCache) S._planPhotoCache = {};
      S._planPhotoCache[bankPlaceId] = url;
      if (!url) return;
      const menu = document.getElementById('plannerContextMenu');
      if (menu && menu.style.display !== 'none' && menu._pinId === bankPlaceId) {
        const wrap = document.getElementById('pin-photo-wrap');
        if (wrap) {
          wrap.style.display = '';
          wrap.innerHTML = '<img src="' + esc(url) + '" style="width:100%;height:100%;object-fit:cover" loading="lazy" onerror="this.parentNode.style.display=\'none\'">';
        }
      }
    });
  });
}

function togglePlanPlaceMark(placeId) {
  const p = S.planBank.find(x => x.id === placeId);
  if (!p) return;
  p.marked = !p.marked;
  _updateMarkerIcon(placeId);
  renderBankBarChips();
  const btn = document.getElementById('pinMarkBtn');
  if (btn) {
    btn.textContent = p.marked ? '⭐ Marked' : '☆ Mark';
    btn.style.color = p.marked ? '#FFE0B0' : 'var(--text)';
  }
  google.script.run
    .withSuccessHandler(() => toast(p.marked ? '⭐ Marked as priority' : 'Unmarked', 'ok'))
    .withFailureHandler(err => toast('Error: ' + err.message, 'err'))
    .savePlanPlaceMark(placeId, S.currentTrip.id, !!p.marked);
}

function editPlanPlace(id) {
  _hideContextMenu();
  const p = S.planBank.find(x => x.id === id);
  if (!p) return;
  S.editingPlaceId = id;
  S.planGpsCoords = hasGpsCoords(p) ? { lat: parseFloat(p.lat), lng: parseFloat(p.lng) } : null;
  S.planGpsSource = S.planGpsCoords ? 'saved' : 'none';
  document.getElementById('planName').value = p.name || '';
  _selectPlanType(p.type || 'place');
  document.getElementById('planDesc').value = p.description || '';
  if (S.planGpsCoords) {
    setPlanGpsStatus('ok', 'Saved: ' + S.planGpsCoords.lat.toFixed(5) + ', ' + S.planGpsCoords.lng.toFixed(5));
  } else {
    setPlanGpsStatus('err', 'No location — tap Location to pick');
  }
  document.getElementById('planSaveBtn').textContent = '✓ Save Changes';
  _positionFormSheet();
  document.getElementById('plan-form-wrap').style.display = 'block';
  var _sw = window.innerWidth - document.documentElement.clientWidth;
  document.body.style.overflow = 'hidden';
  document.body.style.paddingRight = (_sw > 0 ? _sw : 0) + 'px';
  S._suppressSuggestOnFocus = true;
  setTimeout(() => {
    const el = document.getElementById('planName');
    if (el) { el.focus(); el.setSelectionRange(0, 0); el.scrollLeft = 0; }
  }, 80);
}

function savePlanPlaceUI() {
  const name = (document.getElementById('planName').value || '').trim();
  if (!name) { toast('Enter a place name', 'err'); return; }
  const type = document.getElementById('planType').value;
  const desc = (document.getElementById('planDesc').value || '').trim();
  const isEdit = !!S.editingPlaceId;
  const data = {
    tripId:      S.currentTrip.id,
    name, type,
    lat:         S.planGpsCoords ? S.planGpsCoords.lat : null,
    lng:         S.planGpsCoords ? S.planGpsCoords.lng : null,
    description: desc
  };
  if (isEdit) data.id = S.editingPlaceId;

  if (!isEdit && !_planDupeConfirmed && _findDuplicatePlanPlace(name, data.lat, data.lng)) {
    _showDupeWarn();
    return;
  }
  _planDupeConfirmed = false;
  _hideDupeWarn();

  const btn = document.getElementById('planSaveBtn');
  btn.disabled = true; btn.textContent = 'Saving…';
  google.script.run
    .withSuccessHandler(() => {
      btn.disabled = false;
      if (!isEdit) {
        const photoUrl = S._ctxMenuPhotoUrl || null;
        S._planPendingPhotoAssign = { name, photoUrl };
        if (data.lat != null && data.lng != null && S.plannerTab === 'map')
          S._planPendingFocus = { lat: data.lat, lng: data.lng };
      }
      S._ctxMenuPhotoUrl = null;
      cancelPlannerForm();
      loadPlan();
      toast(isEdit ? 'Place updated!' : 'Place added to bank!', 'ok');
    })
    .withFailureHandler(err => {
      btn.disabled = false;
      btn.textContent = isEdit ? '✓ Save Changes' : '+ Add to Bank';
      toast('Error: ' + err.message, 'err');
    })
    .savePlanPlace(data);
}

function ctxMenuDelete(id, evt) {
  const menu = document.getElementById('plannerContextMenu');
  if (menu && menu.style.display !== 'none') {
    S._lastClickXY = { x: parseInt(menu.style.left) + 125, y: parseInt(menu.style.top) };
  } else if (evt) {
    S._lastClickXY = { x: evt.clientX, y: evt.clientY };
  }
  _hideContextMenu();
  confirmDeletePlanPlace(id);
}

function confirmDeletePlanPlace(id) {
  const p = S.planBank.find(x => x.id === id);
  if (!p) return;
  _dismissDeleteConfirm();
  const div = document.createElement('div');
  div.id = 'planDeleteConfirm';
  const anchor = S._lastClickXY || { x: window.innerWidth / 2, y: window.innerHeight / 2 };
  const vw = window.innerWidth, vh = window.innerHeight;
  let left = anchor.x - 125, top = anchor.y + 10;
  left = Math.max(8, Math.min(left, vw - 258));
  top  = Math.min(top, vh - 120);
  div.style.left = left + 'px';
  div.style.top  = top  + 'px';
  div.innerHTML =
    '<div style="font-size:13px;font-weight:700;margin-bottom:5px">Remove from Bank?</div>' +
    '<div style="font-size:12px;color:var(--muted);margin-bottom:11px">&#8220;' + esc(p.name) + '&#8221; and its day assignments will be deleted.</div>' +
    '<div style="display:flex;gap:8px;justify-content:flex-end">' +
    '<button class="btn btn-outline btn-sm" onclick="_dismissDeleteConfirm()" style="padding:5px 12px;min-height:28px;font-size:12px">Cancel</button>' +
    '<button class="btn btn-danger btn-sm" onclick="_dismissDeleteConfirm();doDeletePlanPlace(\'' + id + '\')" style="padding:5px 12px;min-height:28px;font-size:12px">Remove</button>' +
    '</div>';
  document.body.appendChild(div);
  setTimeout(() => {
    if (_deleteConfirmOutsideHandler) document.removeEventListener('click', _deleteConfirmOutsideHandler);
    _deleteConfirmOutsideHandler = function(e) {
      if (!div.contains(e.target)) _dismissDeleteConfirm();
    };
    document.addEventListener('click', _deleteConfirmOutsideHandler);
  }, 80);
}

function _dismissDeleteConfirm() {
  const el = document.getElementById('planDeleteConfirm');
  if (el) el.remove();
  if (_deleteConfirmOutsideHandler) {
    document.removeEventListener('click', _deleteConfirmOutsideHandler);
    _deleteConfirmOutsideHandler = null;
  }
}

function doDeletePlanPlace(id) {
  closeModal();
  // The actual server delete fires FIRST and unconditionally — previously this was
  // the last statement in the function, after several rendering calls; if any of
  // those threw a client-side JS exception, the RPC below would never run at all
  // (silently — client-side exceptions never reach the server logs), which would
  // look exactly like "delete didn't work" with no error anywhere.
  google.script.run
    .withSuccessHandler(res => console.log('[doDeletePlanPlace] server confirmed', res))
    .withFailureHandler(err => toast('Error: ' + err.message, 'err'))
    .deletePlanPlace(id, S.currentTrip.id);

  S.planBank = S.planBank.filter(p => p.id !== id);
  Object.keys(S.planAssignments).forEach(d => {
    S.planAssignments[d] = S.planAssignments[d].filter(pid => pid !== id);
    if (!S.planAssignments[d].length) delete S.planAssignments[d];
  });
  try {
    cancelPlannerForm();
    renderPlanBank();
    initPlannerMap();
    if (S.plannerTab === 'cal') buildPlannerCalendar();
  } catch (e) {
    console.error('[doDeletePlanPlace] rendering error after delete (server call already sent)', e);
  }
  toast('Place removed', 'ok');
}

function switchPlannerTab(tab) {
  S.plannerTab = tab;
  ['cal','map'].forEach(t => {
    document.getElementById('tab-plan-' + t).classList.toggle('on', t === tab);
    document.getElementById('panel-plan-' + t).style.display = t === tab ? 'block' : 'none';
  });
  if (tab === 'cal')  buildPlannerCalendar();
  if (tab === 'map')  setTimeout(() => {
    initPlannerMap(true);
    if (S.plannerMap) google.maps.event.trigger(S.plannerMap, 'resize');
  }, 50);
}

// ---- Planner calendar ----

var _calDnD = {};

function _startCalLongPress(placeId, e) {
  _calLpFired = false;
  _calLpTimer = setTimeout(function() {
    _calLpFired = true;
    const t = e.touches && e.touches[0];
    showPinMenu(placeId, t ? t.clientX : e.clientX, t ? t.clientY : e.clientY);
  }, 500);
}
function _cancelCalLongPress() {
  if (_calLpTimer) { clearTimeout(_calLpTimer); _calLpTimer = null; }
}

function _getDayOrder(date) {
  const stored = S.planOrder && S.planOrder[date];
  if (stored && stored.length) {
    const bankIds     = new Set(S.planBank.map(p => p.id));
    const driveIds    = new Set((S.planDrives[date]      || []).map(d => d.id));
    const activityIds = new Set((S.planActivities[date]  || []).map(a => a.id));
    const valid = stored.filter(o =>
      o.type === 'place' ? bankIds.has(o.id) :
      o.type === 'drive' ? driveIds.has(o.id) :
      o.type === 'activity' ? activityIds.has(o.id) : false);
    if (valid.length) return valid;
  }
  const bId = {}; S.planBank.forEach(p => { bId[p.id] = p; });
  const placeItems    = (S.planAssignments[date] || [])
    .filter(id => bId[id] && bId[id].type !== 'hotel').map(id => ({ type: 'place', id }));
  const driveItems    = (S.planDrives[date]     || []).map(d => ({ type: 'drive',    id: d.id }));
  const activityItems = (S.planActivities[date] || []).map(a => ({ type: 'activity', id: a.id }));
  return [...placeItems, ...driveItems, ...activityItems];
}

function _setDayOrder(date, order) {
  if (!S.planOrder) S.planOrder = {};
  if (order && order.length) S.planOrder[date] = order;
  else delete S.planOrder[date];
}

function _saveDayOrderAsync(date) {
  google.script.run
    .withFailureHandler(err => toast('Order sync: ' + err.message, 'err'))
    .savePlanDayOrder(S.currentTrip.id, date, S.planOrder[date] || []);
}

function _syncOrderOnMutation(date, type, id, action) {
  if (!S.planOrder || !S.planOrder[date]) return;
  if (action === 'remove') {
    S.planOrder[date] = S.planOrder[date].filter(o => !(o.type === type && o.id === id));
    if (!S.planOrder[date].length) delete S.planOrder[date];
  } else {
    S.planOrder[date].push({ type, id });
  }
}

function _calDragStart(e, date, type, id) {
  e.stopPropagation();
  _calDnD = { date, type, id };
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', '');
  e.currentTarget.style.opacity = '0.4';
}

function _calDragOver(e, date, type, id) {
  if (_calDnD.date !== date || (_calDnD.type === type && _calDnD.id === id)) return;
  e.preventDefault();
  e.currentTarget.style.borderTop = '2px solid var(--primary)';
}

function _calDragLeave(e) {
  e.currentTarget.style.borderTop = '';
}

function _calDrop(e, date, type, id) {
  e.preventDefault();
  e.currentTarget.style.borderTop = '';
  if (_calDnD.date !== date || (_calDnD.type === type && _calDnD.id === id)) return;
  const order = _getDayOrder(date);
  const srcIdx = order.findIndex(o => o.type === _calDnD.type && o.id === _calDnD.id);
  const tgtIdx = order.findIndex(o => o.type === type && o.id === id);
  if (srcIdx === -1 || tgtIdx === -1) return;
  const [moved] = order.splice(srcIdx, 1);
  order.splice(tgtIdx, 0, moved);
  _setDayOrder(date, order);
  buildPlannerCalendar();
  _saveDayOrderAsync(date);
}

function _calDragEnd(e) {
  e.currentTarget.style.opacity = '';
  e.currentTarget.style.borderTop = '';
  _calDnD = {};
}

function buildPlannerCalendar() {
  const el = document.getElementById('planCalContent');
  if (!el) return;

  const range = _planDateRange();
  if (!range) {
    el.innerHTML = '<div style="color:var(--muted);text-align:center;padding:32px">Set trip dates or assign places to days to see the calendar</div>';
    return;
  }
  const rangeFirst = range.first, rangeLast = range.last;

  let fFrom = S.planCalFilterFrom || rangeFirst;
  let fTo   = S.planCalFilterTo   || rangeLast || rangeFirst;
  if (fFrom > fTo) { const tmp = fFrom; fFrom = fTo; fTo = tmp; }

  const fd = new Date(fFrom + 'T12:00:00Z');
  const gStart = new Date(fd); gStart.setUTCDate(fd.getUTCDate() - fd.getUTCDay());
  const ld = new Date(fTo + 'T12:00:00Z');
  const gEnd = new Date(ld); gEnd.setUTCDate(ld.getUTCDate() + (6 - ld.getUTCDay()));

  const DOW_SHORT = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const byId = {};
  S.planBank.forEach(p => { byId[p.id] = p; });

  const weeks = [];
  const cur = new Date(gStart);
  while (cur <= gEnd) {
    const week = [];
    for (let i = 0; i < 7; i++) {
      const ds = cur.toISOString().split('T')[0];
      const ids = S.planAssignments[ds] || [];
      const places = ids.map(id => byId[id]).filter(Boolean);
      const hotels    = places.filter(p => p.type === 'hotel');
      const nonHotels = places.filter(p => p.type !== 'hotel');
      const dd = String(cur.getUTCDate()).padStart(2, '0');
      const mm = String(cur.getUTCMonth() + 1).padStart(2, '0');
      week.push({ ds, dd, mm, inRange: ds >= fFrom && ds <= fTo, hotels, nonHotels });
      cur.setUTCDate(cur.getUTCDate() + 1);
    }
    weeks.push(week);
  }

  const dowRow = '<div class="cal7-dow-sticky"><table class="cal7-dow-table"><thead><tr>' +
    DOW_SHORT.map(d => '<th class="cal7-th">' + d + '</th>').join('') +
    '</tr></thead></table></div>';

  const bodyRows = weeks.map(week => {
    const tds = week.map(day => {
      const cls = 'cal7-cell' + (day.inRange ? '' : ' vacant');

      const _dm  = {}; (S.planDrives[day.ds]     || []).forEach(d => { _dm[d.id]  = d; });
      const _amG = {}; (S.planActivities[day.ds] || []).forEach(a => { _amG[a.id] = a; });
      const _gDnd = (type, id) => 'draggable="true" ondragstart="_calDragStart(event,\'' + day.ds + '\',\'' + type + '\',\'' + id + '\')" ondragover="_calDragOver(event,\'' + day.ds + '\',\'' + type + '\',\'' + id + '\')" ondragleave="_calDragLeave(event)" ondrop="_calDrop(event,\'' + day.ds + '\',\'' + type + '\',\'' + id + '\')" ondragend="_calDragEnd(event)"';
      const itemPills = day.inRange ? _getDayOrder(day.ds).map(item => {
        if (item.type === 'place') {
          const p = byId[item.id]; if (!p || p.type === 'hotel') return '';
          const t = LOCATION_TYPES[p.type] || { icon: '📌', color: '#9E9E9E' };
          return '<span class="cal7-pill plan-pill" ' + _gDnd('place', p.id) + ' title="' + esc(p.name) + '" style="cursor:grab;background:' + t.color + '18;color:' + t.color + '" oncontextmenu="event.preventDefault();event.stopPropagation();showPinMenu(\'' + p.id + '\',event.clientX,event.clientY)" ontouchstart="_startCalLongPress(\'' + p.id + '\',event)" ontouchend="_cancelCalLongPress()" ontouchmove="_cancelCalLongPress()">' +
            '<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1">' + t.icon + ' ' + esc(p.name) + '</span>' +
            '<button class="plan-pill-del" onclick="event.stopPropagation();removePlaceFromDayUI(\'' + day.ds + '\',\'' + p.id + '\')">×</button></span>';
        } else if (item.type === 'drive') {
          const d = _dm[item.id]; if (!d) return '';
          return '<span class="cal7-pill" ' + _gDnd('drive', d.id) + ' title="' + esc(d.text) + '" style="cursor:grab;background:#F3F4F6;color:#374151" oncontextmenu="event.preventDefault();event.stopPropagation();editDriveUI(\'' + day.ds + '\',\'' + d.id + '\')">' +
            '<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1">🚗 ' + esc(d.text) + '</span>' +
            '<button class="plan-pill-del" onclick="event.stopPropagation();removeDriveUI(\'' + day.ds + '\',\'' + d.id + '\')">×</button></span>';
        } else if (item.type === 'activity') {
          const a = _amG[item.id]; if (!a) return '';
          return '<span class="cal7-pill" ' + _gDnd('activity', a.id) + ' title="' + esc(a.text) + '" style="cursor:grab;background:#EDE9FE;color:#7C3AED" oncontextmenu="event.preventDefault();event.stopPropagation();editActivityUI(\'' + day.ds + '\',\'' + a.id + '\')">' +
            '<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1">🎯 ' + esc(a.text) + '</span>' +
            '<button class="plan-pill-del" onclick="event.stopPropagation();removeActivityUI(\'' + day.ds + '\',\'' + a.id + '\')">×</button></span>';
        }
        return '';
      }).join('') : '';

      const hotelText = day.hotels.length && day.inRange
        ? '<div class="cal7-foot" style="display:flex;flex-wrap:wrap;gap:2px;align-items:center">' +
          day.hotels.map(p =>
            '<span style="display:inline-flex;align-items:center;gap:2px" title="' + esc(p.name) + '" oncontextmenu="event.preventDefault();event.stopPropagation();showPinMenu(\'' + p.id + '\',event.clientX,event.clientY)">🏨 ' + esc(p.name) +
            '<button class="plan-pill-del" onclick="event.stopPropagation();removePlaceFromDayUI(\'' + day.ds + '\',\'' + p.id + '\')">×</button></span>'
          ).join('<span style="opacity:0.5"> / </span>') +
          '</div>'
        : '';

      const drivePills = day.inRange
        ? (S.planDrives[day.ds] || []).map(d =>
            '<span class="cal7-pill" title="' + esc(d.text) + '" style="background:#F3F4F6;color:#374151">' +
            '<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1">🚗 ' + esc(d.text) + '</span>' +
            '<button class="plan-pill-del" onclick="event.stopPropagation();removeDriveUI(\'' + day.ds + '\',\'' + d.id + '\')">×</button>' +
            '</span>'
          ).join('')
        : '';

      const addBtn = day.inRange
        ? '<button class="plan-add-btn" onclick="openAddMenu(\'' + day.ds + '\')">+ add</button>'
        : '';

      const noteText = (S.planNotes && S.planNotes[day.ds]) || '';
      const hdrCls   = day.inRange ? ' cal7-hdr-edit' : '';
      const hdrClick = day.inRange ? ' onclick="event.stopPropagation();editPlanDayNote(\'' + day.ds + '\')"' : '';
      const noteSpan = (noteText && day.inRange) ? ' <span class="cal7-hdr-desc">' + esc(noteText) + '</span>' : '';
      const isFocused  = day.inRange && S.planCalFocusDay === day.ds;
      const cellClick  = day.inRange ? ' onclick="_togglePlanDayFocus(\'' + day.ds + '\',event)"' : '';
      const focusStyle = isFocused ? ';outline:2px solid var(--primary);outline-offset:-2px;background:#EFF6FF' : '';

      return '<td class="' + cls + '" style="' + (day.inRange ? 'cursor:pointer' : '') + focusStyle + '"' + cellClick + '><div class="cal7-inner">' +
        '<div class="cal7-hdr' + hdrCls + '"' + hdrClick + '>' + day.dd + '/' + day.mm + noteSpan + '</div>' +
        '<div class="cal7-body">' + itemPills + addBtn + '</div>' +
        hotelText + '</div></td>';
    }).join('');
    return '<tr>' + tds + '</tr>';
  }).join('');

  const fv = S.planCalFilterFrom || '';
  const tv = S.planCalFilterTo   || '';
  const hasFilter = fv || tv;
  const isListView = S.planCalView === 'list';
  const _tvBtn = (on) => 'padding:5px 10px;min-height:32px;font-size:13px;font-weight:700;border-radius:7px;cursor:pointer;border:1.5px solid var(--primary);background:' + (on ? 'var(--primary);color:#fff' : '#fff;color:var(--primary)');
  let filterBar = '<div style="display:flex;gap:6px;align-items:center;margin-bottom:10px;flex-wrap:wrap">' +
    '<span style="font-size:11px;font-weight:700;color:var(--muted);white-space:nowrap">From</span>' +
    '<input type="date" class="fc" style="width:132px;padding:5px 8px;font-size:12px;min-height:32px" value="' + fv + '" onblur="S.planCalFilterFrom=this.value||null;buildPlannerCalendar()">' +
    '<span style="font-size:11px;font-weight:700;color:var(--muted);white-space:nowrap">To</span>' +
    '<input type="date" class="fc" style="width:132px;padding:5px 8px;font-size:12px;min-height:32px" value="' + tv + '" onblur="S.planCalFilterTo=this.value||null;buildPlannerCalendar()">';
  if (hasFilter) {
    filterBar += '<button class="btn btn-outline btn-sm" style="padding:5px 10px;min-height:32px;font-size:11px;white-space:nowrap" onclick="S.planCalFilterFrom=null;S.planCalFilterTo=null;buildPlannerCalendar()">&#10005; Clear</button>';
  }
  filterBar += '<div style="display:flex;gap:3px;margin-left:auto">' +
    '<button style="' + _tvBtn(!isListView) + '" onclick="S.planCalView=\'grid\';buildPlannerCalendar()" title="Grid view">⊞</button>' +
    '<button style="' + _tvBtn(isListView)  + '" onclick="S.planCalView=\'list\';buildPlannerCalendar()" title="List view">≡</button>' +
    '</div></div>';

  if (isListView) {
    const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    const inRangeDays = weeks.flatMap(w => w).filter(d => d.inRange);
    const listRows = inRangeDays.map(day => {
      const dow    = DOW[new Date(day.ds + 'T12:00:00Z').getUTCDay()];
      const note   = (S.planNotes && S.planNotes[day.ds]) || '';
      const isFoc  = S.planCalFocusDay === day.ds;
      const noteSpan2 = note ? ' <span style="font-weight:400;font-style:italic;opacity:.8;font-size:12px">' + esc(note) + '</span>' : '';
      const _dmL = {}; (S.planDrives[day.ds]     || []).forEach(d => { _dmL[d.id]  = d; });
      const _amL = {}; (S.planActivities[day.ds] || []).forEach(a => { _amL[a.id] = a; });
      const _dndAttr = (ds, type, id) => 'draggable="true" ondragstart="_calDragStart(event,\'' + ds + '\',\'' + type + '\',\'' + id + '\')" ondragover="_calDragOver(event,\'' + ds + '\',\'' + type + '\',\'' + id + '\')" ondragleave="_calDragLeave(event)" ondrop="_calDrop(event,\'' + ds + '\',\'' + type + '\',\'' + id + '\')" ondragend="_calDragEnd(event)"';
      const _handle = '<span style="cursor:grab;color:var(--muted);font-size:15px;flex-shrink:0;user-select:none;padding:0 2px">⠿</span>';
      let rows = '';
      _getDayOrder(day.ds).forEach(item => {
        if (item.type === 'place') {
          const p = byId[item.id]; if (!p || p.type === 'hotel') return;
          const t = LOCATION_TYPES[p.type] || { icon: '📌', color: '#9E9E9E' };
          rows += '<div ' + _dndAttr(day.ds, 'place', p.id) + ' style="display:flex;align-items:center;gap:8px;padding:5px 12px;font-size:13px" oncontextmenu="event.preventDefault();event.stopPropagation();showPinMenu(\'' + p.id + '\',event.clientX,event.clientY)" ontouchstart="_startCalLongPress(\'' + p.id + '\',event)" ontouchend="_cancelCalLongPress()" ontouchmove="_cancelCalLongPress()">' +
            _handle +
            '<span style="background:' + t.color + '22;color:' + t.color + ';width:26px;height:26px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0">' + t.icon + '</span>' +
            '<span style="flex:1">' + esc(p.name) + '</span>' +
            '<button class="plan-pill-del" onclick="removePlaceFromDayUI(\'' + day.ds + '\',\'' + p.id + '\')">×</button></div>';
        } else if (item.type === 'drive') {
          const d = _dmL[item.id]; if (!d) return;
          rows += '<div ' + _dndAttr(day.ds, 'drive', d.id) + ' style="display:flex;align-items:center;gap:8px;padding:5px 12px;font-size:13px" oncontextmenu="event.preventDefault();event.stopPropagation();editDriveUI(\'' + day.ds + '\',\'' + d.id + '\')">' +
            _handle +
            '<span style="background:#F3F4F6;color:#374151;width:26px;height:26px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0">🚗</span>' +
            '<span style="flex:1">' + esc(d.text) + '</span>' +
            '<button class="plan-pill-del" onclick="removeDriveUI(\'' + day.ds + '\',\'' + d.id + '\')">×</button></div>';
        } else if (item.type === 'activity') {
          const a = _amL[item.id]; if (!a) return;
          rows += '<div ' + _dndAttr(day.ds, 'activity', a.id) + ' style="display:flex;align-items:center;gap:8px;padding:5px 12px;font-size:13px" oncontextmenu="event.preventDefault();event.stopPropagation();editActivityUI(\'' + day.ds + '\',\'' + a.id + '\')">' +
            _handle +
            '<span style="background:#EDE9FE;color:#7C3AED;width:26px;height:26px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0">🎯</span>' +
            '<span style="flex:1">' + esc(a.text) + '</span>' +
            '<button class="plan-pill-del" onclick="removeActivityUI(\'' + day.ds + '\',\'' + a.id + '\')">×</button></div>';
        }
      });
      day.hotels.forEach(p => {
        rows += '<div style="display:flex;align-items:center;gap:8px;padding:5px 12px;font-size:13px" oncontextmenu="event.preventDefault();event.stopPropagation();showPinMenu(\'' + p.id + '\',event.clientX,event.clientY)">' +
          '<span style="background:#9C27B022;color:#9C27B0;width:26px;height:26px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0">🛏️</span>' +
          '<span style="flex:1">' + esc(p.name) + '</span>' +
          '<button class="plan-pill-del" onclick="removePlaceFromDayUI(\'' + day.ds + '\',\'' + p.id + '\')">×</button></div>';
      });
      const cardStyle = 'border-bottom:1px solid var(--border);' + (isFoc ? 'background:#EFF6FF;border-left:3px solid var(--primary);' : '');
      return '<div id="planday-' + day.ds + '" style="' + cardStyle + '">' +
        '<div style="font-weight:700;font-size:13px;padding:8px 12px 5px;cursor:pointer;display:flex;align-items:baseline;gap:6px;color:' + (isFoc ? 'var(--primary)' : 'var(--text)') + '" onclick="_togglePlanDayFocus(\'' + day.ds + '\',event)">' +
        dow + ' ' + day.dd + '/' + day.mm + noteSpan2 + '</div>' +
        rows +
        '<div style="padding:3px 12px 7px"><button class="plan-add-btn" onclick="openAddMenu(\'' + day.ds + '\')">+ add</button></div>' +
        '</div>';
    }).join('');
    el.innerHTML = filterBar + '<div>' + listRows + '</div>';
    if (S.planCalFocusDay) {
      setTimeout(() => {
        const fd = document.getElementById('planday-' + S.planCalFocusDay);
        if (fd) fd.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }, 50);
    }
    return;
  }

  // Grid view
  el.innerHTML = filterBar + dowRow +
    '<div class="cal7-wrap"><table class="cal7-table"><tbody>' + bodyRows + '</tbody></table></div>';

  const calWrap = el.querySelector('.cal7-wrap');
  const dowTable = el.querySelector('.cal7-dow-table');
  if (calWrap && dowTable) {
    calWrap.addEventListener('scroll', function() {
      dowTable.style.transform = 'translateX(-' + calWrap.scrollLeft + 'px)';
    });
  }
}

function _togglePlanDayFocus(dateStr, e) {
  if (e && e.target && e.target.closest('button, a, .cal7-hdr-edit, .cal7-pill')) return;
  S.planCalFocusDay = (S.planCalFocusDay === dateStr) ? null : dateStr;
  buildPlannerCalendar();
}

function editPlanDayNote(dateStr) {
  const current = S.planNotes[dateStr] || '';
  const label = new Date(dateStr + 'T12:00:00Z').toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
  showModal('Note — ' + label,
    '<div class="fg"><textarea class="fc" id="planNoteText" rows="4" placeholder="Add a note for this day…" style="resize:vertical;font-size:14px">' + esc(current) + '</textarea></div>' +
    '<div class="btn-row">' +
    (current ? '<button class="btn btn-danger btn-sm" style="flex:0;white-space:nowrap" onclick="_doSavePlanDayNote(\'' + dateStr + '\',\'\')">Clear</button>' : '') +
    '<button class="btn btn-outline" onclick="closeModal()">Cancel</button>' +
    '<button class="btn btn-primary" onclick="_doSavePlanDayNote(\'' + dateStr + '\',document.getElementById(\'planNoteText\').value)">Save</button>' +
    '</div>');
  setTimeout(() => { const t = document.getElementById('planNoteText'); if (t) { t.focus(); t.setSelectionRange(t.value.length, t.value.length); } }, 150);
}

function _doSavePlanDayNote(dateStr, text) {
  const trimmed = (text || '').trim();
  closeModal();
  if (trimmed) S.planNotes[dateStr] = trimmed;
  else delete S.planNotes[dateStr];
  buildPlannerCalendar();
  google.script.run
    .withSuccessHandler(() => toast(trimmed ? 'Note saved' : 'Note cleared', 'ok'))
    .withFailureHandler(err => toast('Error: ' + err.message, 'err'))
    .savePlanDayNote(S.currentTrip.id, dateStr, trimmed);
}

function openAddMenu(dateStr) {
  const label = new Date(dateStr + 'T12:00:00Z').toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
  const bs = 'display:flex;align-items:center;gap:10px;width:100%;padding:11px 14px;background:#fff;border:1.5px solid var(--border);border-radius:10px;cursor:pointer;font-size:14px;font-weight:600;color:var(--text);text-align:left';
  showModal('Add to ' + label,
    '<div style="display:flex;flex-direction:column;gap:8px;padding:2px 0 10px">' +
    '<button style="' + bs + '" onclick="closeModal();openAssignModal(\'' + dateStr + '\')"><span style="font-size:18px">📍</span> Places from bank</button>' +
    '<button style="' + bs + '" onclick="closeModal();openDriveModal(\'' + dateStr + '\')"><span style="font-size:18px">🚗</span> Drive</button>' +
    '<button style="' + bs + '" onclick="closeModal();openActivityModal(\'' + dateStr + '\')"><span style="font-size:18px">🎯</span> Activity</button>' +
    '<button style="' + bs + '" onclick="closeModal();editPlanDayNote(\'' + dateStr + '\')"><span style="font-size:18px">📝</span> Day note</button>' +
    '</div>');
}

function openDriveModal(dateStr) {
  const label = new Date(dateStr + 'T12:00:00Z').toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
  showModal('🚗 Add Drive — ' + label,
    '<div class="fg"><textarea class="fc" id="driveText" rows="3" placeholder="e.g. Drive to Geneva, ~2h via A40…" style="resize:vertical;font-size:14px"></textarea></div>' +
    '<div class="btn-row">' +
    '<button class="btn btn-outline" onclick="closeModal()">Cancel</button>' +
    '<button class="btn btn-primary" onclick="_saveDriveEntry(\'' + dateStr + '\',document.getElementById(\'driveText\').value)">Add</button>' +
    '</div>');
  setTimeout(() => { const t = document.getElementById('driveText'); if (t) t.focus(); }, 150);
}

function _saveDriveEntry(dateStr, text) {
  const trimmed = (text || '').trim();
  if (!trimmed) { toast('Enter a description', 'err'); return; }
  closeModal();
  if (!S.planDrives[dateStr]) S.planDrives[dateStr] = [];
  const _newDriveId = String(Date.now());
  S.planDrives[dateStr].push({ id: _newDriveId, text: trimmed });
  _syncOrderOnMutation(dateStr, 'drive', _newDriveId, 'add');
  buildPlannerCalendar();
  google.script.run
    .withSuccessHandler(() => toast('Drive added', 'ok'))
    .withFailureHandler(err => toast('Error: ' + err.message, 'err'))
    .savePlanDayDrives(S.currentTrip.id, dateStr, S.planDrives[dateStr]);
}

function removeDriveUI(dateStr, driveId) {
  if (!S.planDrives[dateStr]) return;
  S.planDrives[dateStr] = S.planDrives[dateStr].filter(d => d.id !== driveId);
  if (!S.planDrives[dateStr].length) delete S.planDrives[dateStr];
  _syncOrderOnMutation(dateStr, 'drive', driveId, 'remove');
  buildPlannerCalendar();
  google.script.run
    .withFailureHandler(err => { toast('Sync error: ' + err.message, 'err'); loadPlan(); })
    .savePlanDayDrives(S.currentTrip.id, dateStr, S.planDrives[dateStr] || []);
}

function editDriveUI(dateStr, driveId) {
  const list = S.planDrives[dateStr] || [];
  const d = list.find(x => x.id === driveId); if (!d) return;
  const label = new Date(dateStr + 'T12:00:00Z').toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
  showModal('🚗 Edit Drive — ' + label,
    '<div class="fg"><textarea class="fc" id="driveEditText" rows="3" style="resize:vertical;font-size:14px">' + esc(d.text) + '</textarea></div>' +
    '<div class="btn-row">' +
    '<button class="btn btn-outline" onclick="closeModal()">Cancel</button>' +
    '<button class="btn btn-primary" onclick="_updateDriveEntry(\'' + dateStr + '\',\'' + driveId + '\',document.getElementById(\'driveEditText\').value)">Save</button>' +
    '</div>');
  setTimeout(() => { const t = document.getElementById('driveEditText'); if (t) { t.focus(); t.selectionStart = t.selectionEnd = t.value.length; } }, 150);
}

function _updateDriveEntry(dateStr, driveId, text) {
  const trimmed = (text || '').trim();
  if (!trimmed) { toast('Enter a description', 'err'); return; }
  closeModal();
  const list = S.planDrives[dateStr] || [];
  const d = list.find(x => x.id === driveId); if (!d) return;
  d.text = trimmed;
  buildPlannerCalendar();
  google.script.run
    .withSuccessHandler(() => toast('Drive updated', 'ok'))
    .withFailureHandler(err => toast('Error: ' + err.message, 'err'))
    .savePlanDayDrives(S.currentTrip.id, dateStr, S.planDrives[dateStr]);
}

function editActivityUI(dateStr, activityId) {
  const list = S.planActivities[dateStr] || [];
  const a = list.find(x => x.id === activityId); if (!a) return;
  const label = new Date(dateStr + 'T12:00:00Z').toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
  showModal('🎯 Edit Activity — ' + label,
    '<div class="fg"><textarea class="fc" id="activityEditText" rows="3" style="resize:vertical;font-size:14px">' + esc(a.text) + '</textarea></div>' +
    '<div class="btn-row">' +
    '<button class="btn btn-outline" onclick="closeModal()">Cancel</button>' +
    '<button class="btn btn-primary" onclick="_updateActivityEntry(\'' + dateStr + '\',\'' + activityId + '\',document.getElementById(\'activityEditText\').value)">Save</button>' +
    '</div>');
  setTimeout(() => { const t = document.getElementById('activityEditText'); if (t) { t.focus(); t.selectionStart = t.selectionEnd = t.value.length; } }, 150);
}

function _updateActivityEntry(dateStr, activityId, text) {
  const trimmed = (text || '').trim();
  if (!trimmed) { toast('Enter a description', 'err'); return; }
  closeModal();
  const list = S.planActivities[dateStr] || [];
  const a = list.find(x => x.id === activityId); if (!a) return;
  a.text = trimmed;
  buildPlannerCalendar();

function filterAssignList(q) {
  const term = q.trim().toLowerCase();

function applyAssignment(dateStr) {
  const cbs = document.querySelectorAll('#modalBody input[type=checkbox]');
  const selected = [];
  cbs.forEach(cb => { if (cb.checked) selected.push(cb.value); });
  closeModal();
  // Sync custom order: remove unchecked places, append newly checked ones
  if (S.planOrder && S.planOrder[dateStr]) {
    const selSet = new Set(selected);
    S.planOrder[dateStr] = S.planOrder[dateStr].filter(o => o.type !== 'place' || selSet.has(o.id));
    const inOrd = new Set(S.planOrder[dateStr].filter(o => o.type === 'place').map(o => o.id));
    const bId2 = {}; S.planBank.forEach(p => { bId2[p.id] = p; });
    selected.filter(id => !inOrd.has(id) && bId2[id] && bId2[id].type !== 'hotel')
            .forEach(id => S.planOrder[dateStr].push({ type: 'place', id }));
    if (!S.planOrder[dateStr].length) delete S.planOrder[dateStr];
  }
  if (selected.length) S.planAssignments[dateStr] = selected;
  else delete S.planAssignments[dateStr];
  buildPlannerCalendar();
  google.script.run
    .withFailureHandler(err => { toast('Sync error: ' + err.message, 'err'); loadPlan(); })
    .setPlanDayAssignment(S.currentTrip.id, dateStr, selected);
}

    S.planAssignments[dateStr] = S.planAssignments[dateStr].filter(id => id !== placeId);
    if (!S.planAssignments[dateStr].length) delete S.planAssignments[dateStr];
  }

  buildPlannerCalendar();
